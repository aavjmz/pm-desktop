// Detail panels shown under the stats strip for whichever cards are expanded.
// How many rows each expandable stat panel renders before collapsing the rest behind a
// "show all" button. These lists grow with the square of the plan's size (conflicts are
// pairs), and rendering thousands of rows on every re-render was the single largest cost
// once several dozen projects were loaded — in every tab, not just the timeline.
var STAT_LIST_CAP = 12;
var statShowAll = { month: false, conflicts: false };
function renderStatDetails(conflictsInfo, monthTasks, activeProjectList){
  var root = document.getElementById("conflictPanel");
  if(!root) return;
  var out = "";
  function moreBtn(key, total, shown){
    return '<button class="btn ghost small sd-more" data-stat-more="' + key + '">显示全部 ' +
      total + ' 条（当前显示 ' + shown + ' 条）</button>';
  }

  // --- 进行中项目 ---
  if(state.statOpen.projects){
    if(activeProjectList.length === 0){
      out += '<div class="stat-detail"><div class="sd-title">进行中项目</div><div class="sd-empty">暂无进行中的项目</div></div>';
    } else {
      // one pass over the tasks instead of two filters per project
      var tally = Object.create(null);
      state.milestones.forEach(function(m){
        var t = tally[m.projectId] || (tally[m.projectId] = { open: 0, total: 0 });
        t.total++;
        if(m.status !== "done") t.open++;
      });
      var rows = activeProjectList.map(function(p){
        var cnt = tally[p.id] || { open: 0, total: 0 };
        var open = cnt.open, total = cnt.total;
        var sub = [p.client, p.platform].filter(Boolean).join(" · ");
        return '<div class="sd-row" data-goto-proj="' + p.id + '">' +
          '<span class="swatch" style="background:' + p.color + '"></span>' +
          '<span class="sd-name">' + escapeHtml(p.name) + '</span>' +
          (sub ? '<span class="sd-sub">' + escapeHtml(sub) + '</span>' : '') +
          '<span class="sd-meta"><span class="proj-status-badge ps-' + projStatus(p) + '">' + PROJ_STATUS_LABEL[projStatus(p)] + '</span> ' + open + ' 个未完成 / 共 ' + total + '</span></div>';
      }).join("");
      out += '<div class="stat-detail"><div class="sd-title">进行中项目（' + activeProjectList.length + '）</div>' + rows + '</div>';
    }
  }

  // --- 本月待关注里程碑 ---
  if(state.statOpen.month){
    if(monthTasks.length === 0){
      out += '<div class="stat-detail"><div class="sd-title">本月待关注里程碑</div><div class="sd-empty">本月没有待关注的里程碑</div></div>';
    } else {
      var sorted = monthTasks.slice().sort(function(a,b){ return a.end < b.end ? -1 : (a.end > b.end ? 1 : 0); });
      var mCapped = statShowAll.month ? sorted : sorted.slice(0, STAT_LIST_CAP);
      var mrows = mCapped.map(function(m){
        return '<div class="sd-row" data-open-task="' + m.id + '">' +
          '<span class="pill ' + m.status + '">' + STATUS_LABEL[m.status] + '</span>' +
          '<span class="sd-name">' + (m.isMilestone ? '<span class="ms-tag">◆</span>' : '') + escapeHtml(m.title) + '</span>' +
          '<span class="sd-sub">' + escapeHtml(projName(m.projectId)) + '</span>' +
          (m.owner ? '<span class="sd-owner">' + escapeHtml(m.owner) + '</span>' : '') +
          '<span class="sd-meta">' + fmtShort(m.start) + '–' + fmtShort(m.end) + '</span></div>';
      }).join("");
      out += '<div class="stat-detail"><div class="sd-title">本月待关注里程碑（' + monthTasks.length + '）</div>' + mrows +
        (sorted.length > mCapped.length ? moreBtn("month", sorted.length, mCapped.length) : '') + '</div>';
    }
  }

  // --- 人力资源冲突 ---
  if(state.statOpen.conflicts){
    if(conflictsInfo.conflicts.length === 0){
      out += '<div class="conflict-panel clear">✓ 当前没有检测到人力资源冲突</div>';
    } else {
      var allC = conflictsInfo.conflicts;
      var cCapped = statShowAll.conflicts ? allC : allC.slice(0, STAT_LIST_CAP);
      var items = cCapped.map(function(c){
        return '<div class="conflict-item"><span class="tag">冲突</span><b>' + escapeHtml(c.owner) + '</b> 同时负责 ' +
          '「' + escapeHtml(projName(c.a.projectId)) + ' · ' + escapeHtml(c.a.title) + '」(' + fmtShort(c.a.start) + '–' + fmtShort(c.a.end) + ') 与 ' +
          '「' + escapeHtml(projName(c.b.projectId)) + ' · ' + escapeHtml(c.b.title) + '」(' + fmtShort(c.b.start) + '–' + fmtShort(c.b.end) + ')，建议重新安排人力</div>';
      }).join("");
      out += '<div class="conflict-panel alert"><div class="conflict-title">⚠ 检测到 ' + allC.length + ' 处人力冲突</div>' + items +
        (allC.length > cCapped.length ? moreBtn("conflicts", allC.length, cCapped.length) : '') + '</div>';
    }
  }

  root.innerHTML = out;

  root.querySelectorAll("[data-stat-more]").forEach(function(btn){
    btn.addEventListener("click", function(){
      statShowAll[btn.getAttribute("data-stat-more")] = true;
      renderStatDetails(conflictsInfo, monthTasks, activeProjectList);
    });
  });

  // clicking a project row jumps to the projects tab
  root.querySelectorAll("[data-goto-proj]").forEach(function(el){
    el.addEventListener("click", function(){
      state.activeTab = "projects";
      renderAll();
    });
  });
  // clicking a milestone row opens its editor
  root.querySelectorAll("[data-open-task]").forEach(function(el){
    el.addEventListener("click", function(){
      var m = getTask(el.getAttribute("data-open-task"));
      if(m) openMilestoneModal(m);
    });
  });
}

/* ---------- render: timeline tab ---------- */
function getTimelineRange(list){
  list = list || state.milestones;
  var dated = list.filter(function(m){ return m.start && m.end; });
  if(dated.length === 0){
    return { start: addDays(todayISO(), -7), end: addDays(todayISO(), 30) };
  }
  var min = dated[0].start, max = dated[0].end;
  dated.forEach(function(m){
    if(m.start < min) min = m.start;
    if(m.end > max) max = m.end;
  });
  return { start: addDays(min, -7), end: addDays(max, 14) };
}

function monthTicks(range){
  var ticks = [];
  var d = toDate(monthStartISO(range.start));
  var endD = toDate(range.end);
  while(d <= endD){
    var iso = isoOf(d);
    ticks.push({ label: (d.getFullYear()) + "年" + (d.getMonth()+1) + "月", offset: daysBetween(range.start, iso) * DAY_W });
    d.setMonth(d.getMonth()+1);
  }
  return ticks;
}

function passesFilter(m){
  if(state.filterStatus === "unfinished"){
    if(m.status === "done") return false;
  } else if(state.filterStatus !== "all"){
    if(m.status !== state.filterStatus) return false;
  }
  if(state.filterType === "milestone" && !m.isMilestone) return false;
  if(state.filterType === "task" && m.isMilestone) return false;
  return true;
}

/* ---------- timeline geometry ----------
   Laying out a few thousand absolutely-positioned bars is what actually costs the time once
   a few dozen projects are loaded: the markup is cheap, the layout is not. Rather than
   window the bars in JS, the rows carry `content-visibility:auto`, so the browser skips
   layout for every row scrolled out of view — it virtualizes better than hand-written code
   and every bar stays in the DOM, which keeps the dependency connectors complete.

   The one rule that makes that work: nothing may read a bar's own offsets. Querying layout
   inside a skipped row forces it to lay out, which would undo the whole thing. So the
   connectors derive x/width from the same date arithmetic that positioned the bars, and
   take y from the row boxes, which are laid out even when their contents are skipped. */
var TL_LABEL_W = 172;
var TL_LANE_H = 38;          // .lane height
var TL_BAR_TOP = 6;          // .bar top within its lane
var TL_BAR_H = 26;           // .bar height
var tlPaint = null;          // { lanes: [{items,color}], range } — set by renderTimelineTab

function tlBarX(m, range){ return daysBetween(range.start, m.start) * DAY_W; }
function tlBarW(m, range){
  var raw = (daysBetween(m.start, m.end) + 1) * DAY_W - (DAY_W >= 8 ? 4 : 1);
  // A 40px floor keeps a one-day bar readable at full zoom, but at small scales it would
  // make every bar the same size and overlap its neighbours, so it shrinks with the scale.
  var floor = DAY_W >= 12 ? 40 : (DAY_W >= 5 ? 14 : 4);
  return Math.max(raw, floor);
}

function tlBarHtml(m, color, range, cpm, cpActive, conflictIds){
  var left = tlBarX(m, range);
  var width = tlBarW(m, range);
  var isConflict = !!conflictIds[m.id];
  var cpInfo = cpm.tasks[m.id];
  var isCritical = cpActive && cpInfo && cpInfo.critical;
  var isDimmed = cpActive && cpInfo && !cpInfo.critical;
  var cls = "bar status-" + m.status + (isConflict ? " conflict" : "") + (m.isMilestone ? " is-milestone" : "") + (isCritical ? " critical-path" : "") + (isDimmed ? " cp-dimmed" : "");
  var typeLabel = m.isMilestone ? "里程碑" : "普通任务";
  var depNames = (m.deps && m.deps.length) ? m.deps.map(function(id){ var d=getTask(id); return d?d.title:""; }).filter(Boolean) : [];
  var cpLine = "";
  if(cpInfo){
    cpLine = cpInfo.critical ? "关键路径：是（无浮动，不可延期）\n" : "浮动时间：" + cpInfo.slack + " 个工作日\n";
  }
  var title = escapeHtml(projName(m.projectId)) + " · " + escapeHtml(m.title) + "\n" +
    "类型：" + typeLabel + "\n" +
    (m.owner ? "责任人：" + escapeHtml(m.owner) + "\n" : "") +
    m.start + " ~ " + m.end + "\n" +
    "工时：" + (m.workdays || countWorkdays(m.start, m.end)) + " 个工作日\n" +
    // escaped like every other interpolation: a quote in a predecessor's title would
    // otherwise terminate the title attribute and corrupt the rest of the bar's markup
    (depNames.length ? "前置：" + escapeHtml(depNames.join("、")) + "\n" : "") +
    cpLine +
    "状态：" + STATUS_LABEL[m.status];
  var icon = m.isMilestone ? '<span class="ms-icon">◆</span>' : '<span class="dot"></span>';
  var depMark = (m.deps && m.deps.length) ? '<span class="dep-mark">🔗</span>' : '';
  return '<div class="' + cls + '" style="left:' + left + 'px;width:' + width + 'px;background:' + color + ';" title="' + title + '" data-open-ms="' + m.id + '" data-task-id="' + m.id + '">' + icon + escapeHtml(m.title) + depMark + '</div>';
}

function renderTimelineTab(conflictsInfo){
  var filtered = state.milestones.filter(function(m){ return passesFilter(m) && taskProjectVisible(m) && taskPassesDoneFilter(m); });
  var scheduled = filtered.filter(function(m){ return m.start && m.end; });
  var unscheduledCount = filtered.length - scheduled.length;
  // One task with a mistyped year (0226, 2300…) used to stretch the range to hundreds of
  // years: a canvas millions of pixels wide plus one background node per off-day, which is
  // both what froze the page and what pushed every real bar out of sight. Tasks far from
  // today are kept off the timeline and reported, so the person can go and fix the date.
  var saneLo = addDays(todayISO(), -TL_SANE_DAYS), saneHi = addDays(todayISO(), TL_SANE_DAYS);
  var badDateTasks = [];
  var visible = scheduled.filter(function(m){
    if(m.start >= saneLo && m.end <= saneHi) return true;
    badDateTasks.push(m);
    return false;
  });
  var range = getTimelineRange(visible);
  var totalDays = daysBetween(range.start, range.end) + 1;
  DAY_W = pickDayWidth(totalDays);
  document.documentElement.style.setProperty("--week-w", (DAY_W * 7) + "px");
  document.documentElement.style.setProperty("--row-w", (TL_LABEL_W + totalDays * DAY_W) + "px");
  document.documentElement.classList.toggle("tl-dense", DAY_W < 12);
  var totalWidth = totalDays * DAY_W;
  var ticks = monthTicks(range);
  var todayOffset = null;
  var t = todayISO();
  if(t >= range.start && t <= range.end){ todayOffset = daysBetween(range.start, t) * DAY_W; }

  var cpm = computeCriticalPaths();
  var cpActive = (state.groupBy === "project" && state.showCP);

  var groups;
  if(state.groupBy === "project"){
    groups = visibleProjects().map(function(p){
      return { label: p.name, color: p.color, items: visible.filter(function(m){ return m.projectId === p.id; }), projId: p.id };
    });
  } else {
    var byOwner = {};
    var order = [];
    visible.forEach(function(m){
      var o = (m.owner || "").trim() || "未分配";
      if(!byOwner[o]){ byOwner[o] = []; order.push(o); }
      byOwner[o].push(m);
    });
    groups = order.map(function(o){ return { label: o, color: null, items: byOwner[o] }; });
  }

  var headerTicks = ticks.map(function(tk){
    return '<div class="month-tick" style="left:' + tk.offset + 'px;">' + tk.label + '</div>';
  }).join("");
  var todayHtml = todayOffset !== null
    ? '<div class="today-tick" style="left:' + todayOffset + 'px;"><div class="line"></div><div class="label">今天</div></div>'
    : "";

  // Day-background stripes (weekend / holiday / makeup). These used to be repeated inside
  // every row's track, which multiplied one stripe per off-day by the number of rows — tens
  // of thousands of nodes on a wide range with many projects. They now live in a single
  // full-height layer behind all the tracks, so the count is per day, not per day per row.
  var dayBgHtml = "";
  // Below a few pixels a day, weekend shading is just noise (and thousands of nodes), so
  // only holidays stay marked.
  var stripeWeekends = DAY_W >= 6;
  for(var di=0; di<totalDays; di++){
    var iso = addDays(range.start, di);
    var vis = dayVisual(iso);
    if(vis === "workday") continue; // default, no stripe
    if(vis === "weekend" && !stripeWeekends) continue;
    var leftPx = di * DAY_W;
    var titleTxt = vis === "holiday" ? "节假日（放假）" : (vis === "makeup" ? "调休上班" : "周末");
    dayBgHtml += '<div class="day-bg ' + vis + '" style="left:' + leftPx + 'px;width:' + DAY_W + 'px;" title="' + iso + " " + titleTxt + '"></div>';
  }
  var dayBgLayer = '<div class="day-bg-layer" id="dayBgLayer" style="width:' + totalWidth + 'px;">' + dayBgHtml + '</div>';

  // Lane membership is recorded so the connector pass can place each bar's y from its row
  // without touching the bar itself.
  tlPaint = { lanes: [], range: range };

  var rowsHtml = "";
  if(groups.length === 0){
    rowsHtml = '<div class="tl-row"><div class="tl-label" style="color:var(--text-dim);">暂无项目</div><div class="tl-track" style="width:' + totalWidth + 'px;"></div></div>';
  } else {
    groups.forEach(function(g){
      var lanes = packLanes(g.items);
      var headerColor = g.color ? '<span class="swatch" style="background:' + g.color + '"></span>' : '';
      var cpSummary = "";
      if(state.groupBy === "project" && g.projId && cpm.projects[g.projId]){
        var ps = cpm.projects[g.projId];
        if(ps.endISO){
          cpSummary = '<span class="cp-summary" title="关键路径长度与预计完成日">关键路径 ' + ps.workdays + ' 工日 · 预计 ' + fmtShort(ps.endISO) + ' 完成</span>';
        }
      }
      rowsHtml += '<div class="tl-row group-header"><div class="tl-label">' + headerColor + '<span>' + escapeHtml(g.label) + '</span><span class="cnt">' + g.items.length + '</span></div><div class="tl-track" style="width:' + totalWidth + 'px;">' + (cpSummary ? '<div class="cp-summary-wrap">' + cpSummary + '</div>' : '') + '</div></div>';
      if(lanes.length === 0){
        rowsHtml += '<div class="tl-row"><div class="tl-label"></div><div class="tl-track" style="width:' + totalWidth + 'px;"><div class="empty-lane-note">无符合条件的任务</div></div></div>';
      } else {
        lanes.forEach(function(lane){
          var laneIdx = tlPaint.lanes.length;
          tlPaint.lanes.push({ items: lane });
          var barsHtml = lane.map(function(m){
            var color = state.groupBy === "project" ? g.color : projColor(m.projectId);
            return tlBarHtml(m, color, range, cpm, cpActive, conflictsInfo.conflictIds);
          }).join("");
          rowsHtml += '<div class="tl-row"><div class="tl-label"></div><div class="tl-track" style="width:' + totalWidth + 'px;"><div class="lane" data-lane="' + laneIdx + '">' + barsHtml + '</div></div></div>';
        });
      }
    });
  }

  var statusFilterOpts = [["all","全部状态"],["not_started","未开始"],["in_progress","进行中"],["unfinished","未完成"],["delayed","延期"]];
  var statusSelHtml = statusFilterOpts.map(function(o){
    return '<option value="' + o[0] + '"' + (state.filterStatus === o[0] ? " selected" : "") + '>' + o[1] + '</option>';
  }).join("");
  var typeSeg =
    '<div class="segmented sm">' +
      '<button data-ftype="all" class="' + (state.filterType === "all" ? "active" : "") + '">全部</button>' +
      '<button data-ftype="milestone" class="' + (state.filterType === "milestone" ? "active" : "") + '">◆ 里程碑</button>' +
      '<button data-ftype="task" class="' + (state.filterType === "task" ? "active" : "") + '">普通任务</button>' +
    '</div>';
  var filterActive = (state.filterStatus !== "all" || state.filterType !== "all");
  var zoomOpts = [["fit","自适应"],["26","日"],["12","周"],["5","月"],["2","季"]];
  var zoomSeg = '<div class="tl-zoom"><span class="filter-label">缩放</span><div class="segmented sm">' +
    zoomOpts.map(function(o){
      return '<button data-zoom="' + o[0] + '" class="' + (String(state.zoom) === o[0] ? "active" : "") + '">' + o[1] + '</button>';
    }).join("") +
    '</div><span class="zoom-note">' + totalDays + ' 天 · ' + DAY_W + 'px/天</span></div>';

  var html =
    '<div class="panel-toolbar">' +
      '<div class="segmented">' +
        '<button data-group="project" class="' + (state.groupBy === "project" ? "active" : "") + '">按项目分组</button>' +
        '<button data-group="owner" class="' + (state.groupBy === "owner" ? "active" : "") + '">按责任人分组</button>' +
      '</div>' +
      '<div class="filter-group">' +
        projStatusFilterHtml() +
        zoomSeg +
        '<span class="filter-label">筛选</span>' +
        '<select id="fFilterStatus" class="filter-select">' + statusSelHtml + '</select>' +
        typeSeg +
        (state.groupBy === "project" ? '<button class="btn ghost small" id="fToggleDeps">' + (state.showDeps ? "隐藏依赖连线" : "显示依赖连线") + '</button>' : '') +
        (state.groupBy === "project" ? '<button class="btn ghost small" id="fToggleCP">' + (state.showCP ? "隐藏关键路径" : "显示关键路径") + '</button>' : '') +
        '<button class="btn ghost small" id="fJumpToday" title="将时间线滚动到今天">⦿ 今天</button>' +
        (filterActive ? '<button class="btn ghost small" id="fFilterClear">清除筛选</button>' : '') +
      '</div>' +
    '</div>' +
    '<div class="filter-summary">显示 ' + visible.length + ' / ' + state.milestones.length + ' 个任务' + (unscheduledCount > 0 ? '（另有 ' + unscheduledCount + ' 个未排期任务，可在项目列表中设置日期）' : '') + '</div>' +
    (badDateTasks.length > 0
      ? '<div class="filter-summary" style="color:var(--accent-warn);">⚠ ' + badDateTasks.length + ' 个任务的日期偏离今天 10 年以上，疑似填错，已不在时间线显示：' +
        badDateTasks.slice(0, 5).map(function(m){ return escapeHtml(projName(m.projectId)) + "·" + escapeHtml(m.title) + "（" + m.start + " ~ " + m.end + "）"; }).join("；") +
        (badDateTasks.length > 5 ? " 等" : "") + '，请到项目列表修正日期</div>'
      : '') +
    '<div class="timeline-table" id="timelineTable">' +
      dayBgLayer +
      '<svg class="dep-svg" id="depSvg" width="' + totalWidth + '" style="left:172px;"></svg>' +
      '<div class="tl-row tl-header-row"><div class="tl-label"></div><div class="tl-track" style="width:' + totalWidth + 'px;">' + headerTicks + todayHtml + '</div></div>' +
      rowsHtml +
    '</div>';

  document.getElementById("tabContent").innerHTML = html;

  document.querySelectorAll(".segmented button[data-group]").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.groupBy = btn.getAttribute("data-group");
      renderAll();
    });
  });
  document.querySelectorAll(".segmented button[data-ftype]").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.filterType = btn.getAttribute("data-ftype");
      renderAll();
    });
  });
  document.querySelectorAll(".segmented button[data-zoom]").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.zoom = btn.getAttribute("data-zoom");
      timelineScrollLeft = null;        // scale changed — recentre rather than keep a stale offset
      renderAll();
    });
  });
  document.getElementById("fFilterStatus").addEventListener("change", function(e){
    state.filterStatus = e.target.value;
    renderAll();
  });
  var clr = document.getElementById("fFilterClear");
  if(clr){ clr.addEventListener("click", function(){ state.filterStatus = "all"; state.filterType = "all"; renderAll(); }); }

  wireProjStatusFilter();
  var toggleBtn = document.getElementById("fToggleDeps");
  if(toggleBtn){
    toggleBtn.addEventListener("click", function(){ state.showDeps = !state.showDeps; renderAll(); });
  }
  var toggleCPBtn = document.getElementById("fToggleCP");
  if(toggleCPBtn){
    toggleCPBtn.addEventListener("click", function(){ state.showCP = !state.showCP; renderAll(); });
  }

  // ----- jump to today -----
  // todayOffset is the pixel x of today's column within the track (null if out of range).
  var jumpBtn = document.getElementById("fJumpToday");
  if(jumpBtn){
    if(todayOffset === null){
      jumpBtn.disabled = true;
      jumpBtn.title = "今天不在当前时间范围内";
      jumpBtn.classList.add("is-disabled");
    } else {
      jumpBtn.addEventListener("click", function(){ scrollTimelineToToday(todayOffset, true); });
    }
  }

  enableTimelineDragScroll();

  // Restore scroll position across re-renders; first time, center on today.
  var tbl = document.getElementById("timelineTable");
  if(tbl){
    if(timelineScrollLeft !== null){
      tbl.scrollLeft = timelineScrollLeft;
    } else if(todayOffset !== null){
      scrollTimelineToToday(todayOffset, false);
    }
    tbl.addEventListener("scroll", function(){ timelineScrollLeft = tbl.scrollLeft; });
  }

  // Draw dependency connectors (Visio-style orthogonal routing) after layout settles.
  // Only in project grouping and when enabled.
  if(state.groupBy === "project" && state.showDeps){
    // rAF ensures the DOM has laid out so we can measure offsets.
    requestAnimationFrame(function(){ drawDependencyLines(cpm); });
  }
}

// Centre the timeline viewport on today's column.
function scrollTimelineToToday(todayOffset, smooth){
  var tbl = document.getElementById("timelineTable");
  if(!tbl) return;
  var LABEL_W = 172;
  // Put today roughly 1/3 from the left so upcoming work is visible.
  var target = LABEL_W + todayOffset - (tbl.clientWidth - LABEL_W) / 3;
  if(target < 0) target = 0;
  if(smooth && typeof tbl.scrollTo === "function"){
    tbl.scrollTo({ left: target, behavior: "smooth" });
  } else {
    tbl.scrollLeft = target;
  }
  timelineScrollLeft = target;
}

// Click-and-drag anywhere on the timeline background to pan horizontally.
function enableTimelineDragScroll(){
  var tbl = document.getElementById("timelineTable");
  if(!tbl || tbl.dataset.dragBound === "1") return;
  tbl.dataset.dragBound = "1";

  var dragging = false, startX = 0, startScroll = 0, moved = false;

  tbl.addEventListener("mousedown", function(e){
    if(e.button !== 0) return;
    // Don't hijack drags that start on a task bar — those are click targets.
    if(e.target.closest(".bar")) return;
    dragging = true; moved = false;
    startX = e.pageX;
    startScroll = tbl.scrollLeft;
    tbl.classList.add("dragging");
  });
  window.addEventListener("mousemove", function(e){
    if(!dragging) return;
    var dx = e.pageX - startX;
    if(Math.abs(dx) > 3) moved = true;
    tbl.scrollLeft = startScroll - dx;
    timelineScrollLeft = tbl.scrollLeft;
    if(moved) e.preventDefault();
  });
  window.addEventListener("mouseup", function(){
    if(!dragging) return;
    dragging = false;
    tbl.classList.remove("dragging");
    if(moved) suppressNextBarClick = true;
  });
  // Shift+wheel / trackpad horizontal scroll already works natively.
}

// Measure bar positions and render orthogonal connector paths into #depSvg.
function drawDependencyLines(cpmIn){
  var svg = document.getElementById("depSvg");
  var table = document.getElementById("timelineTable");
  if(!svg || !table || !tlPaint) return;
  var range = tlPaint.range;

  // Geometry map: taskId -> position in the track coordinate space.
  //   x / w  come from the same date arithmetic that positioned the bar
  //   y       comes from the bar's ROW box, which is laid out even when the row's contents
  //           are skipped by content-visibility — reading the bar itself would force every
  //           off-screen row to lay out and undo the virtualization.
  var geo = {};
  var laneEls = table.querySelectorAll(".lane[data-lane]");
  for(var li = 0; li < laneEls.length; li++){
    var laneEl = laneEls[li];
    var info = tlPaint.lanes[+laneEl.getAttribute("data-lane")];
    if(!info) continue;
    var rowEl = laneEl.parentElement ? laneEl.parentElement.parentElement : null;   // .lane -> .tl-track -> .tl-row
    if(!rowEl) continue;
    var yMid = rowEl.offsetTop + TL_BAR_TOP + TL_BAR_H / 2;
    for(var ii = 0; ii < info.items.length; ii++){
      var m = info.items[ii];
      geo[m.id] = { x: tlBarX(m, range), w: tlBarW(m, range), yMid: yMid };
    }
  }

  // Size the svg to cover the full scroll height/width.
  var totalW = table.scrollWidth - TL_LABEL_W;
  var totalH = table.scrollHeight;
  svg.setAttribute("height", totalH);
  svg.setAttribute("width", totalW > 0 ? totalW : table.scrollWidth);
  svg.style.height = totalH + "px";

  // The whole connector layer is assembled as one markup string and written once. Creating
  // and appending a path element per dependency meant a DOM insertion per connector.
  var svgParts = ['<defs>' +
    '<marker id="depArrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">' +
      '<path d="M0,0 L6,3 L0,6 Z" fill="var(--dep-line)"></path></marker>' +
    '<marker id="depArrowBad" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">' +
      '<path d="M0,0 L6,3 L0,6 Z" fill="var(--accent-crit)"></path></marker>' +
    '<marker id="depArrowCP" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">' +
      '<path d="M0,0 L6,3 L0,6 Z" fill="var(--cp-line)"></path></marker>' +
    '</defs>'];

  var GAP = 10;      // horizontal stub length
  var cpm = cpmIn || computeCriticalPaths();
  var cpOn = state.showCP;
  state.milestones.forEach(function(t){
    if(!t.deps || t.deps.length === 0) return;
    var to = geo[t.id];
    if(!to) return;                     // dependent not on timeline (unscheduled/filtered)
    t.deps.forEach(function(depId){
      var from = geo[depId];
      if(!from) return;                 // prereq not on timeline
      var dep = getTask(depId);
      // "broken" if dependent starts before prereq ends (dependent left edge < prereq right edge)
      var broken = (to.x < from.x + from.w - 1);
      // critical connector: both ends on the critical path (and CP display on)
      var ci1 = cpm.tasks[depId], ci2 = cpm.tasks[t.id];
      var isCP = cpOn && ci1 && ci1.critical && ci2 && ci2.critical;
      // start point: right-center of prereq bar; end point: left-center of dependent bar
      var x1 = from.x + from.w, y1 = from.yMid;
      var x2 = to.x, y2 = to.yMid;
      var midX;
      if(x2 >= x1 + GAP*2){
        midX = x2 - GAP;
      } else {
        midX = x1 + GAP;
      }
      var d;
      if(x2 >= x1 + GAP*2){
        d = "M" + x1 + "," + y1 +
            " H" + midX +
            " V" + y2 +
            " H" + x2;
      } else {
        var chY = (y1 + y2) / 2;
        d = "M" + x1 + "," + y1 +
            " H" + (x1 + GAP) +
            " V" + chY +
            " H" + (x2 - GAP) +
            " V" + y2 +
            " H" + x2;
      }
      // priority: broken (red) > critical (gold) > normal (grey)
      var stroke = broken ? "var(--accent-crit)" : (isCP ? "var(--cp-line)" : "var(--dep-line)");
      var sw = broken ? "2" : (isCP ? "2.5" : "1.5");
      var marker = broken ? "url(#depArrowBad)" : (isCP ? "url(#depArrowCP)" : "url(#depArrow)");
      var tip = (dep ? dep.title : "?") + " → " + t.title +
        (broken ? "（依赖被破坏：后置早于前置完成）" : (isCP ? "（关键路径）" : ""));
      svgParts.push('<path d="' + d + '" fill="none" stroke="' + stroke + '" stroke-width="' + sw + '"' +
        (broken ? ' stroke-dasharray="5,3"' : '') + ' marker-end="' + marker + '">' +
        '<title>' + escapeHtml(tip) + '</title></path>');
    });
  });
  svg.innerHTML = svgParts.join("");
}

/* ---------- render: projects tab ---------- */
function renderProjectsTab(conflictsInfo){
  if(state.projects.length === 0){
    document.getElementById("tabContent").innerHTML =
      '<div class="empty-state"><div class="glyph">◇</div><p>还没有项目</p><p>点击右上角「新建项目」开始搭建里程碑看板</p></div>';
    return;
  }
  var shownProjects = visibleProjects();

  var viewSeg =
    '<div class="segmented sm">' +
      '<button data-projview="board" class="' + (state.projView === "board" ? "active" : "") + '">▦ 看板</button>' +
      '<button data-projview="list" class="' + (state.projView === "list" ? "active" : "") + '">☰ 列表</button>' +
    '</div>';
  var toolbarHtml =
    '<div class="panel-toolbar">' +
      '<div class="filter-group">' + projStatusFilterHtml() + '</div>' +
      viewSeg +
    '</div>';

  function wireViewSwitch(){
    document.querySelectorAll("[data-projview]").forEach(function(el){
      el.addEventListener("click", function(){
        state.projView = el.getAttribute("data-projview");
        renderAll();
      });

  }

  if(shownProjects.length === 0){
    document.getElementById("tabContent").innerHTML = toolbarHtml +
      '<div class="empty-state"><div class="glyph">◇</div><p>当前筛选条件下没有项目</p><p>切换上方的项目筛选可查看其它状态的项目</p></div>';
    wireProjStatusFilter();
    wireViewSwitch();
    return;

  if(state.projView === "list"){
    renderProjectsListView(shownProjects, conflictsInfo, toolbarHtml);
    wireProjStatusFilter();
    wireViewSwitch();
    wireProjectRowActions();
    return;
  }

  var cards = shownProjects.map(function(p){
    var tree = projectTaskTree(p.id, true);
    var rows = tree.length === 0
      ? '<div class="empty-note">暂无里程碑</div>'
      : tree.map(function(node){
          var m = node.task, lvl = node.level;
          var isConflict = !!conflictsInfo.conflictIds[m.id];
          var datesTxt = (m.start && m.end)
            ? (fmtShort(m.start) + '–' + fmtShort(m.end) + ' · ' + (m.workdays || countWorkdays(m.start, m.end)) + '工日')
            : '未排期 · ' + (m.workdays || 1) + '工日';
          var canAddChild = (lvl < MAX_TASK_DEPTH);
          var indent = (lvl - 1) * 16;
          return '<div class="ms-row lvl-' + lvl + (isConflict ? " conflict" : "") + '" style="padding-left:' + (8 + indent) + 'px;">' +
            (lvl > 1 ? '<span class="tree-branch">↳</span>' : '') +
            '<span class="pill ' + m.status + '">' + STATUS_LABEL[m.status] + '</span>' +
            '<span class="ms-title" data-open-ms="' + m.id + '">' + (m.isMilestone ? '<span class="ms-tag">◆</span>' : '') + escapeHtml(m.title) + '</span>' +
            (m.owner ? '<span class="ms-owner">' + escapeHtml(m.owner) + '</span>' : '') +
            '<span class="ms-dates">' + datesTxt + '</span>' +
            (isConflict ? '<span style="color:var(--accent-crit);font-size:12px;">⚠</span>' : '') +
            (canAddChild ? '<button class="sub-add" data-add-sub="' + m.id + '" title="添加子任务（第 ' + (lvl+1) + ' 级）">＋子</button>' : '') +
            '</div>';
        }).join("");
    return '<div class="proj-card' + (projStatus(p) === "archived" || projStatus(p) === "paused" ? " proj-inactive" : "") + '">' +
      '<div class="bar-top" style="background:' + p.color + ';"></div>' +
      '<div class="head">' +
        '<div><h3>' + escapeHtml(p.name) + ' <span class="proj-status-badge ps-' + projStatus(p) + '">' + PROJ_STATUS_LABEL[projStatus(p)] + '</span></h3>' +
        '<div class="meta">' + [escapeHtml(p.client), escapeHtml(p.platform)].filter(Boolean).join(" · ") + '</div></div>' +
        '<div class="actions"><button class="btn ghost small" data-edit-proj="' + p.id + '">编辑</button></div>' +
      '</div>' +
      '<div class="ms-list">' + rows + '</div>' +
      '<div class="card-foot"><button class="btn small" data-add-ms="' + p.id + '">＋ 添加里程碑</button></div>' +
    '</div>';
  }).join("");

  document.getElementById("tabContent").innerHTML =
    toolbarHtml +
    '<div class="card-grid">' + cards + '</div>';
  wireProjStatusFilter();
  wireViewSwitch();

  document.querySelectorAll("[data-edit-proj]").forEach(function(el){
    el.addEventListener("click", function(){
      openProjectModal(getProject(el.getAttribute("data-edit-proj")));
    });
  });
  document.querySelectorAll("[data-add-ms]").forEach(function(el){
    el.addEventListener("click", function(){
      openMilestoneModal(null, el.getAttribute("data-add-ms"));
    });
  });
  document.querySelectorAll("[data-add-sub]").forEach(function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      var parent = getTask(el.getAttribute("data-add-sub"));
      if(!parent) return;
      if(taskLevel(parent) >= MAX_TASK_DEPTH){
        showToast("最多支持 " + MAX_TASK_DEPTH + " 级任务", true);
        return;
      }
      openMilestoneModal(null, parent.projectId, parent.id);
    });
  });
}

/* ---------- render: projects tab — list (table) view ---------- */
function renderProjectsListView(shownProjects, conflictsInfo, toolbarHtml){
  var blocks = shownProjects.map(function(p){
    var tree = projectTaskTree(p.id, true);
    var collapsed = !!projListCollapsed[p.id];
    var doneCount = tree.filter(function(n){ return n.task.status === "done"; }).length;
    var totalWd = tree.reduce(function(s,n){ return s + (n.task.workdays || 0); }, 0);
    var sub = [p.client, p.platform].filter(Boolean).join(" · ");

    // ---- build a WBS table where each task's name cell spans all of its leaf rows ----
    // leafCount: how many table rows a task occupies (1 if it has no children).
    function leafCount(taskId){
      var kids = visibleChildrenOf(taskId);
      if(kids.length === 0) return 1;
      return kids.reduce(function(s,k){ return s + leafCount(k.id); }, 0);
    }
    function taskCell(m, lvl, span){
      var isConflict = !!conflictsInfo.conflictIds[m.id];
      var canAddChild = (lvl < MAX_TASK_DEPTH);
      var dateTxt = (m.start && m.end)
        ? (fmtShort(m.start) + '–' + fmtShort(m.end) + ' · ' + (m.workdays || 1) + '工日')
        : '未排期';
      var depNames = (m.deps && m.deps.length)
        ? m.deps.map(function(id){ var d = getTask(id); return d ? d.title : ""; }).filter(Boolean).join("、")
        : "";
      return '<td class="pl-cell lvl-' + lvl + (isConflict ? " conflict" : "") + '" rowspan="' + span + '" data-open-ms="' + m.id + '">' +
        '<div class="pl-cell-top">' +
          (m.isMilestone ? '<span class="ms-tag">◆</span>' : '') +
          '<span class="pl-title">' + escapeHtml(m.title) + '</span>' +
          (isConflict ? '<span class="pl-warn">⚠</span>' : '') +
          (canAddChild ? '<button class="sub-add" data-add-sub="' + m.id + '" title="添加子任务">＋子</button>' : '') +
        '</div>' +
        '<div class="pl-cell-meta">' +
          '<span class="pill ' + m.status + '">' + STATUS_LABEL[m.status] + '</span>' +
          '<span class="pl-date">' + dateTxt + '</span>' +
          (m.owner ? '<span class="pl-owner">' + escapeHtml(m.owner) + '</span>' : '') +
          (depNames ? '<span class="pl-deps" title="前置：' + escapeHtml(depNames) + '">← ' + escapeHtml(depNames) + '</span>' : '') +
        '</div>' +
      '</td>';
    }
    // Walk the tree emitting rows; a task opens its cell on the first row it covers.
    var rowsHtml = "";
    var rowBuf = [];
    function walk(task, lvl){
      var kids = visibleChildrenOf(task.id);
      rowBuf.push(taskCell(task, lvl, leafCount(task.id)));
      if(kids.length === 0){
        // pad the remaining level columns so every row has MAX_TASK_DEPTH cells
        var pad = "";
        for(var c = lvl + 1; c <= MAX_TASK_DEPTH; c++){ pad += '<td class="pl-empty"></td>'; }
        rowsHtml += '<tr>' + rowBuf.join("") + pad + '</tr>';
        rowBuf = [];
      } else {
        kids.forEach(function(k){ walk(k, lvl + 1); });
      }
    }
    tree.filter(function(n){ return n.level === 1; }).forEach(function(n){ walk(n.task, 1); });

    return '<div class="pl-block' + (projStatus(p) === "archived" || projStatus(p) === "paused" ? " proj-inactive" : "") + '">' +
      '<div class="pl-head" data-toggle-proj="' + p.id + '">' +
        '<span class="pl-caret' + (collapsed ? "" : " open") + '">▾</span>' +
        '<span class="swatch" style="background:' + p.color + '"></span>' +
        '<span class="pl-name">' + escapeHtml(p.name) + '</span>' +
        '<span class="proj-status-badge ps-' + projStatus(p) + '">' + PROJ_STATUS_LABEL[projStatus(p)] + '</span>' +
        (sub ? '<span class="pl-sub">' + escapeHtml(sub) + '</span>' : '') +
        '<span class="pl-stats">' + tree.length + ' 个任务 · ' + doneCount + ' 已完成 · 合计 ' + totalWd + ' 工日</span>' +
        '<span class="pl-head-actions">' +
          '<button class="btn ghost small" data-add-ms="' + p.id + '">＋ 里程碑</button>' +
          '<button class="btn ghost small" data-edit-proj="' + p.id + '">编辑</button>' +
        '</span>' +
      '</div>' +
      (collapsed ? '' :
        (tree.length === 0
          ? '<div class="empty-note" style="padding:10px 16px;">暂无里程碑</div>'
          : '<div class="pl-table-wrap"><table class="pl-table wbs">' +
              '<thead><tr>' +
                '<th>一级任务（里程碑）</th><th>二级任务</th><th>三级任务</th><th>四级任务</th>' +
              '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>')) +
    '</div>';
  }).join("");

  document.getElementById("tabContent").innerHTML = toolbarHtml + '<div class="pl-wrap">' + blocks + '</div>';
}

/* ---------- render: owners tab ---------- */
function renderOwnersTab(conflictsInfo){
  var byOwner = {};
  var order = [];
  state.milestones.filter(function(m){ return taskProjectVisible(m) && taskPassesDoneFilter(m); }).forEach(function(m){
    var o = (m.owner || "").trim() || "未分配";
    if(!byOwner[o]){ byOwner[o] = []; order.push(o); }
    byOwner[o].push(m);
  });
  if(order.length === 0){
    document.getElementById("tabContent").innerHTML =
      '<div class="panel-toolbar"><div class="filter-group">' + projStatusFilterHtml() + '</div></div>' +
      '<div class="empty-state"><div class="glyph">◇</div><p>当前筛选条件下没有任务</p><p>创建里程碑并填写责任人，或切换上方的项目筛选</p></div>';
    wireProjStatusFilter();
    return;
  }
  order.sort(function(a,b){ return a === "未分配" ? 1 : (b === "未分配" ? -1 : a.localeCompare(b)); });

  var panels = order.map(function(owner){
    var list = byOwner[owner].slice().sort(function(a,b){ return a.start < b.start ? -1 : 1; });
    var conflictCount = list.filter(function(m){ return conflictsInfo.conflictIds[m.id]; }).length;
    var rows = list.map(function(m){
      var isConflict = !!conflictsInfo.conflictIds[m.id];
      return '<div class="ms-row' + (isConflict ? " conflict" : "") + '" data-open-ms="' + m.id + '">' +
        '<span class="swatch" style="background:' + projColor(m.projectId) + '"></span>' +
        '<span class="ms-title">' + (m.isMilestone ? '<span class="ms-tag">◆</span>' : '') + escapeHtml(projName(m.projectId)) + ' · ' + escapeHtml(m.title) + '</span>' +
        '<span class="pill ' + m.status + '">' + STATUS_LABEL[m.status] + '</span>' +
        '<span class="ms-dates">' + fmtShort(m.start) + '–' + fmtShort(m.end) + '</span>' +
        (isConflict ? '<span style="color:var(--accent-crit);font-size:12px;">⚠ 冲突</span>' : '') +
        '</div>';
    }).join("");
    return '<div class="owner-panel">' +
      '<div class="oh"><h3>' + escapeHtml(owner) + '</h3><div class="sub">' + list.length + ' 个里程碑' + (conflictCount ? ' · <span style="color:var(--accent-crit);">' + conflictCount + ' 个存在冲突</span>' : '') + '</div></div>' +
      '<div class="ms-list" style="padding-top:8px;">' + rows + '</div>' +
    '</div>';
  }).join("");

  document.getElementById("tabContent").innerHTML =
    '<div class="panel-toolbar"><div class="filter-group">' + projStatusFilterHtml() + '</div></div>' + panels;
  wireProjStatusFilter();
}

/* ---------- master render ---------- */
function renderAll(){
  var conflictsInfo = computeConflicts();
  renderStats(conflictsInfo);   // also renders the expandable detail panels
  document.querySelectorAll(".tab").forEach(function(t){
    t.classList.toggle("active", t.getAttribute("data-tab") === state.activeTab);
  });
  if(state.activeTab === "timeline") renderTimelineTab(conflictsInfo);
  else if(state.activeTab === "projects") renderProjectsTab(conflictsInfo);
  else renderOwnersTab(conflictsInfo);
}

/* ---------- top-level events ---------- */
// One delegated click handler for every task opener in every view. Binding a listener per
// bar / per row used to mean thousands of listeners attached on each re-render.
document.getElementById("tabContent").addEventListener("click", function(e){
  var el = e.target.closest ? e.target.closest("[data-open-ms]") : null;
  if(!el) return;
  // A pan that ended over a bar shouldn't also open the editor.
  if(suppressNextBarClick){ suppressNextBarClick = false; return; }
  e.stopPropagation();
  var m = getTask(el.getAttribute("data-open-ms"));
  if(m) openMilestoneModal(m);
});
document.querySelectorAll(".tab").forEach(function(t){
  t.addEventListener("click", function(){
    state.activeTab = t.getAttribute("data-tab");
    renderAll();
  });
});
document.getElementById("btnTheme").addEventListener("click", function(){ openThemeModal(); });
document.getElementById("btnCalendar").addEventListener("click", function(){ openCalendarModal(); });
document.getElementById("btnTemplates").addEventListener("click", function(){ openTemplateManagerModal(); });
document.getElementById("btnExportExcel").addEventListener("click", function(){ openExportExcelModal(); });
document.getElementById("btnImportExcel").addEventListener("click", function(){ openImportExcelModal(); });
document.getElementById("btnNewProject").addEventListener("click", function(){ openProjectModal(null); });
document.getElementById("btnNewMilestone").addEventListener("click", function(){ openMilestoneModal(null); });
document.getElementById("btnExport").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify({ projects: state.projects, milestones: state.milestones }, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "milestone-dashboard-backup-" + todayISO() + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast("已导出备份文件");
});
document.getElementById("fImport").addEventListener("change", function(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      if(!parsed || !Array.isArray(parsed.projects) || !Array.isArray(parsed.milestones)){
        throw new Error("format mismatch");
      }
      openConfirm("导入备份将覆盖当前所有数据，此操作不可撤销。", function(){
        mutate(function(){
          state.projects = parsed.projects;
          state.milestones = parsed.milestones;
        });
        showToast("备份已导入");
      });
    } catch(err){
      showToast("文件格式不正确，导入失败", true);
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});
document.getElementById("btnReset").addEventListener("click", function(){
  openConfirm("这将清空所有项目与里程碑数据（包括示例数据），并恢复初始示例。此操作不可撤销。", function(){
    mutate(function(){ seedSampleData(); });
    showToast("数据已重置");
  });
});

// Apply default theme immediately so the loading screen matches, then load saved prefs.
applyTheme();
refreshThemeWatchers();

/* Startup used to be four independent async blocks, two of which called renderAll — so a
   large plan was laid out once against an empty calendar and again once the data arrived.
   Everything now loads in parallel (sharing one key listing, so it is one round trip plus
   the gets) and renders exactly once, after both the calendar and the data are in hand.

   The ordering matters, it is not just tidiness: which days are working days comes from the
   calendar, and the saved tasks are migrated and rolled up with countWorkdays. Rolling up
   before the calendar landed would compute — and cache — the wrong workday counts. */
(function init(){
  showLoading(true);
  var themeReady = loadThemeSettings().then(function(){
    applyTheme();
    refreshThemeWatchers();
  }).catch(function(e){ console.warn("load theme failed", e); });

  var calendarReady = loadCalendar().catch(function(e){ console.warn("load calendar failed", e); });
  loadTemplates().catch(function(e){ console.warn("load templates failed", e); });

  loadData(calendarReady).catch(function(e){
    console.error("unexpected load error", e);
    showLoading(false);
    renderAll();
  });
  void themeReady;   // theme applies on its own; nothing waits on it
})();
})();
</script>
</body>
</html>
