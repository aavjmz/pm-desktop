    '</div>'
  );
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mCancel").addEventListener("click", closeModal);
  document.getElementById("impDrop").addEventListener("click", function(){
    document.getElementById("fImpFile").click();
  });
  document.getElementById("fImpFile").addEventListener("change", function(e){
    var file = e.target.files && e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = new Uint8Array(reader.result);
        var wb = XLSX.read(data, { type: "array", cellDates: true });
        handleImportWorkbook(wb);
      }catch(err){
        console.error("import read failed", err);
        showImportResult({ error: "无法读取文件，请确认是有效的 Excel 文件" });
      }
      e.target.value = "";
    };
    reader.readAsArrayBuffer(file);
  });
}

function handleImportWorkbook(wb){
  var parsed = parseImportWorkbook(wb);
  if(parsed.error){ showImportResult({ error: parsed.error }); return; }
  var res = validateImportRows(parsed.rows, parsed.depPairs);
  if(res.errors.length){ showImportResult({ errors: res.errors }); return; }
  showImportResult({ ok: true, groups: res.groups, projStatusByName: res.projStatusByName, notes: res.notes });
}

function showImportResult(result){
  var root = document.getElementById("impResult");
  if(!root) return;
  if(result.error){
    root.innerHTML = '<div class="imp-err"><div class="imp-err-title">✗ 导入失败</div><div class="imp-err-body">' + escapeHtml(result.error) + '</div></div>';
    return;
  }
  if(result.errors){
    var items = result.errors.slice(0, 50).map(function(e){ return '<li>' + escapeHtml(e) + '</li>'; }).join("");
    var more = result.errors.length > 50 ? '<li>… 其余 ' + (result.errors.length - 50) + ' 条错误未显示</li>' : '';
    root.innerHTML = '<div class="imp-err"><div class="imp-err-title">✗ 校验未通过，共 ' + result.errors.length + ' 处问题（未修改任何数据）</div>' +
      '<ul class="imp-err-list">' + items + more + '</ul></div>';
    return;
  }
  if(result.ok){
    var groups = result.groups;
    var psMap = result.projStatusByName || {};
    var notes = result.notes || {};
    var names = Object.keys(groups);
    var summary = names.map(function(n){
      var psNote = psMap[n] ? '，项目状态设为「' + PROJ_STATUS_LABEL[psMap[n]] + '」' : '';
      return '<li><b>' + escapeHtml(n) + '</b>：将更新为 ' + groups[n].length + ' 个任务（覆盖原有任务）' + psNote + '</li>';
    }).join("");
    var noteLines = [];
    if(notes.autoParents > 0){
      noteLines.push('文件每行包含完整层级路径，已自动补建 ' + notes.autoParents + ' 个父任务');
    }
    if(notes.roundedWorkdays > 0){
      noteLines.push(notes.roundedWorkdays + ' 个任务的工时不是整数（如 0 或 0.5），已向上取整为整数工作日');
    }
    if(notes.depSheetCount > 0){
      noteLines.push('从「' + DEP_SHEET_NAME + '」工作表读取了 ' + notes.depSheetCount + ' 条依赖关系');
    }
    var notesHtml = noteLines.length
      ? '<div class="imp-note">⚠ ' + noteLines.map(escapeHtml).join('<br>⚠ ') + '</div>'
      : '';
    root.innerHTML = '<div class="imp-ok"><div class="imp-ok-title">✓ 校验通过，可导入</div>' +
      '<ul class="imp-ok-list">' + summary + '</ul>' + notesHtml +
      '<button class="btn primary" id="impConfirm" style="margin-top:10px;">确认导入并更新 ' + names.length + ' 个项目</button></div>';
    document.getElementById("impConfirm").addEventListener("click", function(){
      applyImport(groups, psMap);
      closeModal();
      state.activeTab = "projects";
      renderAll();
      showToast("导入完成，已更新 " + names.length + " 个项目");
    });
  }
}

/* ---------- date utils ---------- */
function pad(n){ return n<10 ? "0"+n : ""+n; }
function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function toDate(s){ return new Date(s+"T00:00:00"); }
function todayISO(){ return isoOf(new Date()); }
function addDays(iso, n){ var d=toDate(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function daysBetween(a,b){ return Math.round((toDate(b)-toDate(a))/86400000); }
function fmtShort(s){ var d=toDate(s); return (d.getMonth()+1)+"/"+d.getDate(); }
function monthStartISO(iso){ var d=toDate(iso); d.setDate(1); return isoOf(d); }
function currentMonthRange(){
  var d = new Date();
  var start = new Date(d.getFullYear(), d.getMonth(), 1);
  var end = new Date(d.getFullYear(), d.getMonth()+1, 0);
  return { start: isoOf(start), end: isoOf(end) };
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function delay(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

function storagePresent(){
  return !!(window.storage && typeof window.storage.get === "function" && typeof window.storage.set === "function");
}

// This environment throws "Internal server error" when getting a key that was never
// written (confirmed via diagnostic). To avoid that, we list keys first and only get()
// when the key is present. We list with an empty prefix and check membership ourselves,
// so we don't depend on how prefix-matching is implemented.
/* The four saved documents (data, theme, calendar, templates) each used to call
   storage.list("") before their get, so startup fired the same listing four times. One
   shared promise now serves all of them; it is reset after any write so a later read still
   sees newly created keys. */
var _keyListPromise = null;
function savedKeyList(){
  if(_keyListPromise) return _keyListPromise;
  _keyListPromise = (async function(){
    if(!storagePresent()) return null;
    try{
      var listed = await window.storage.list("", false);
      return (listed && listed.keys) ? listed.keys : [];
    } catch(e){
      console.warn("storage.list failed", e);
      return null;            // null = unknown; callers fall back to a guarded get
    }
  })();
  return _keyListPromise;
}
function invalidateKeyList(){ _keyListPromise = null; }

/* Read one saved document.

   storage.get() throws rather than returning empty when a key was never written, which is
   why startup used to list the keys first and only then fetch — two sequential round trips
   before anything could be drawn. The order is inverted here: fetch straight away, and only
   if that throws fall back to the listing to tell "never saved" (normal, quiet) apart from
   "storage is unwell" (worth a retry and a warning). A returning user, which is the usual
   case, now pays one round trip instead of two; a first-time user pays the same as before.

   Returns { ok, value }: ok=false means the read genuinely failed, value=null with ok=true
   means there is nothing saved under that key yet. */
async function readSavedDoc(key){
  if(!storagePresent()) return { ok:false, value:null };
  try{
    var res = await window.storage.get(key, false);
    return { ok:true, value: (res && res.value) ? res.value : null };
  } catch(e){
    // Expected for a key that has never been written — confirm before making noise.
  }
  var keys = await savedKeyList();
  if(keys && keys.indexOf(key) === -1){
    return { ok:true, value:null };     // confirmed: nothing saved yet
  }
  // The key exists (or the listing itself failed) — a genuine problem, so retry once.
  for(var i = 0; i < 2; i++){
    try{
      var r2 = await window.storage.get(key, false);
      return { ok:true, value: (r2 && r2.value) ? r2.value : null };
    } catch(e2){
      console.warn("storage.get retry " + (i+1) + " for " + key, e2);
      if(i < 1) await delay(400);
    }
  }
  return { ok:false, value:null };
}

async function tryReadSaved(key){
  return readSavedDoc(key);
}

// Probe whether writes actually work, by writing the REAL key with current state and
// confirming via list() that it now exists. No junk probe key left behind.
async function probeStorageWrite(){
  if(!storagePresent()) return false;
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({ projects: state.projects, milestones: state.milestones }), false);
    invalidateKeyList();
    var listed = await window.storage.list("", false);
    var keys = (listed && listed.keys) ? listed.keys : [];
    return keys.indexOf(STORAGE_KEY) !== -1;
  } catch(e){
    console.warn("storage write probe failed", e);
    return false;
  }
}

async function loadData(calendarReady){
  showLoading(true);
  var savedLoaded = false;
  try{
    // Fetch in parallel; the calendar only has to be settled before the migration below,
    // which depends on it for workday arithmetic.
    var readPromise = tryReadSaved(STORAGE_KEY);
    if(calendarReady) await calendarReady;
    var read = await readPromise;
    if(read.ok && read.value){
      var parsed = JSON.parse(read.value);
      state.projects = parsed.projects || [];
      // Migration: projects saved before the status feature default to 进行中.
      state.projects.forEach(function(p){
        if(!p.status || !PROJ_STATUS_LABEL[p.status]){ p.status = "in_progress"; }
      });
      state.milestones = parsed.milestones || [];
      // Migration: tasks saved before the milestone-flag feature default to milestone=true.
      state.milestones.forEach(function(m){
        if(typeof m.isMilestone === "undefined"){ m.isMilestone = true; }
        if(typeof m.workdays === "undefined" || m.workdays === null){ m.workdays = countWorkdays(m.start, m.end); }
        if(!Array.isArray(m.deps)){ m.deps = []; }
        if(typeof m.parentId === "undefined"){ m.parentId = null; }
      });
      // Rule: only top-level tasks may be milestones.
      // Type follows level: top-level tasks are milestones, children never are.
      state.milestones.forEach(function(m){ m.isMilestone = !m.parentId; });
      rollupParentDates();   // make existing parents span their children
      savedLoaded = (state.projects.length > 0 || state.milestones.length > 0);
    }
  } catch(e){
    console.warn("parse saved data failed", e);
  }
  if(!savedLoaded){ seedSampleData(); }

  // Determine if writes work so the banner reflects reality.
  if(savedLoaded){
    // We already read real data back — storage is clearly working. Don't rewrite it.
    storageAvailable = true;
  } else {
    storageAvailable = await probeStorageWrite();
  }
  storageChecked = true;

  showLoading(false);
  renderAll();
  updateStorageBanner();
}

function updateStorageBanner(){
  var banner = document.getElementById("storageBanner");
  if(!banner) return;
  if(storageAvailable){ banner.innerHTML = ""; return; }
  var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
  var local = !storagePresent();
  var msg;
  if(local){
    msg = "⚠ 当前不在 claude.ai 发布环境中运行（本地文件打开），无法自动保存。请在 claude.ai 的发布链接中打开，或使用「导出备份」保存数据。";
  } else if(isMobile){
    msg = "⚠ 持久化存储目前不支持手机端，本次改动不会自动保存。请用「导出备份」保存数据，并在电脑网页版/桌面版打开以获得自动保存。";
  } else {
    msg = "⚠ 存储写入未成功，本次改动可能不会自动保存。请用「导出备份」保存数据，稍后再重试。";
  }
  banner.innerHTML = '<div class="storage-banner">' + msg + '</div>';
}

async function persist(){
  if(!storagePresent()){
    storageAvailable = false;
    updateStorageBanner();
    return;
  }
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({ projects: state.projects, milestones: state.milestones }), false);
    invalidateKeyList();
    storageAvailable = true;
    saveFailWarned = false;
    updateStorageBanner();
  } catch(e){
    console.warn("save failed (still working in-memory)", e);
    storageAvailable = false;
    updateStorageBanner();
    if(!saveFailWarned){
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "");
      showToast(isMobile ? "手机端暂不支持自动保存，建议先导出备份" : "保存失败，请稍后重试或导出备份", true);
      saveFailWarned = true;
    }
  }
}

// Bumped by every change to projects/tasks/calendar. Derived caches (child index, critical
// paths) key off it so they rebuild exactly once per change instead of once per lookup.
var dataVersion = 0;
function bumpDataVersion(){ dataVersion++; }
function mutate(fn){
  fn();
  dataVersion++;
  persist();
  renderAll();
}

/* ---------- lookups ----------
   getTask / getProject are called thousands of times per render — every bar tooltip, every
   hierarchy walk, every conflict pair — so they go through an id -> object map instead of a
   linear scan over the array. The map is rebuilt whenever the array's identity or length
   changes, which covers every add, remove and wholesale replacement; ids are assigned once
   at creation and never mutated, and nothing assigns into the arrays by index. */
var _projIdx = { arr: null, len: -1, map: null };
var _taskIdx = { arr: null, len: -1, map: null };
function _idxMap(cache, arr){
  if(cache.arr !== arr || cache.len !== arr.length){
    var m = Object.create(null);
    for(var i = 0; i < arr.length; i++){ if(arr[i]) m[arr[i].id] = arr[i]; }
    cache.arr = arr; cache.len = arr.length; cache.map = m;
  }
  return cache.map;
}
function getProject(id){ return _idxMap(_projIdx, state.projects)[id]; }
function projName(id){ var p = getProject(id); return p ? p.name : "未知项目"; }
function projColor(id){ var p = getProject(id); return p ? p.color : "#5B8DEF"; }
function getTask(id){ return _idxMap(_taskIdx, state.milestones)[id]; }
// Children, keyed by parentId — childrenOf is called per task by the rollup, the tree walk
// and the export, each of which would otherwise scan every task.
// Unlike ids, a task's parentId can be reassigned in place, so this map is also keyed on
// dataVersion, which every mutation bumps.
var _kidsIdx = { arr: null, len: -1, ver: -1, map: null };
function _kidsMap(){
  var arr = state.milestones;
  if(_kidsIdx.arr !== arr || _kidsIdx.len !== arr.length || _kidsIdx.ver !== dataVersion){
    var m = Object.create(null);
    for(var i = 0; i < arr.length; i++){
      var t = arr[i];
      if(!t) continue;
      var k = t.parentId || "";
      (m[k] = m[k] || []).push(t);
    }
    _kidsIdx.arr = arr; _kidsIdx.len = arr.length; _kidsIdx.ver = dataVersion; _kidsIdx.map = m;
  }
  return _kidsIdx.map;
}

/* ---------- project status + platform filtering ---------- */
// Distinct hardware platforms across all projects, sorted.
function allPlatforms(){
  var set = {};
  state.projects.forEach(function(p){
    var v = (p.platform || "").trim();
    if(v) set[v] = true;
  });
  return Object.keys(set).sort();
}
// Shared filter control (used by all three views): project status + hardware platform.
function projStatusFilterHtml(){
  var opts = [["active","进行中的项目"],["all","全部项目"]]
    .concat(Object.keys(PROJ_STATUS_LABEL).map(function(k){ return [k, PROJ_STATUS_LABEL[k]]; }));
  var sel = opts.map(function(o){
    return '<option value="' + o[0] + '"' + (state.filterProjStatus === o[0] ? " selected" : "") + '>' + o[1] + '</option>';
  }).join("");

  var platforms = allPlatforms();
  var platHtml = "";
  if(platforms.length > 0){
    var pOpts = '<option value="all"' + (state.filterPlatform === "all" ? " selected" : "") + '>全部平台</option>' +
      platforms.map(function(pf){
        return '<option value="' + escapeHtml(pf) + '"' + (state.filterPlatform === pf ? " selected" : "") + '>' + escapeHtml(pf) + '</option>';
      }).join("");
    platHtml = '<span class="filter-label">平台</span>' +
      '<select id="fPlatformFilter" class="filter-select">' + pOpts + '</select>';
  }

  var hidden = state.projects.length - visibleProjects().length;
  var doneBtn = '<button class="btn ghost small' + (state.hideDoneTasks ? " on" : "") + '" id="fHideDone" ' +
    'title="隐藏状态为「已完成」的任务">' + (state.hideDoneTasks ? "☑" : "☐") + ' 隐藏已完成</button>';
  return '<span class="filter-label">项目</span>' +
    '<select id="fProjStatusFilter" class="filter-select">' + sel + '</select>' +
    platHtml +
    doneBtn +
    (hidden > 0 ? '<span class="proj-hidden-note">已隐藏 ' + hidden + ' 个项目</span>' : '');
}
// Wire it up after rendering; re-renders everything on change.
function wireProjStatusFilter(){
  var el = document.getElementById("fProjStatusFilter");
  if(el){
    el.addEventListener("change", function(e){
      state.filterProjStatus = e.target.value;
      renderAll();
    });
  }
  var pel = document.getElementById("fPlatformFilter");
  if(pel){
    pel.addEventListener("change", function(e){
      state.filterPlatform = e.target.value;
      renderAll();
    });
  }
  var del = document.getElementById("fHideDone");
  if(del){
    del.addEventListener("click", function(){
      state.hideDoneTasks = !state.hideDoneTasks;
      renderAll();
    });
  }
}

/* ---------- hide-completed-tasks filter ----------
   A parent is kept whenever any descendant is still unfinished, so hiding
   completed work never orphans the children that are still in flight. */
function taskPassesDoneFilter(m){
  if(!state.hideDoneTasks) return true;
  if(m.status !== "done") return true;
  // a completed parent stays visible if something under it is not done yet
  return descendantsOf(m.id).some(function(d){ return d.status !== "done"; });
}

function projStatus(p){ return (p && p.status) ? p.status : "in_progress"; }
// Does this project pass the current project-status AND platform filters?
function projectPassesFilter(p){
  var f = state.filterProjStatus;
  var s = projStatus(p);
  var statusOk;
  if(f === "all") statusOk = true;
  else if(f === "active") statusOk = (s !== "archived" && s !== "paused");
  else statusOk = (s === f);
  if(!statusOk) return false;
  if(state.filterPlatform !== "all"){
    if((p.platform || "").trim() !== state.filterPlatform) return false;
  }
  return true;
}
// Projects visible under the current filter.
function visibleProjects(){
  return state.projects.filter(projectPassesFilter);
}
// Is this task's project visible?
function taskProjectVisible(m){
  var p = getProject(m.projectId);
  return p ? projectPassesFilter(p) : true;
}

/* ---------- task hierarchy (parentId, max 3 levels of children => 4 levels total) ---------- */
var MAX_TASK_DEPTH = 4;   // level 1 (top) .. level 4 (3rd-level child)
// Level of a task: 1 for top-level, 2..4 for children. Cycle-safe.
function taskLevel(task){
  var lvl = 1, cur = task, guard = 0;
  while(cur && cur.parentId && guard < 10){
    var p = getTask(cur.parentId);
    if(!p) break;
    lvl++; cur = p; guard++;
  }
  return lvl;
}
// Tasks of one project, in stable order — same deal as the child index.
var _projTasksIdx = { arr: null, len: -1, ver: -1, map: null };
function tasksOfProject(projectId){
  var arr = state.milestones;
  if(_projTasksIdx.arr !== arr || _projTasksIdx.len !== arr.length || _projTasksIdx.ver !== dataVersion){
    var m = Object.create(null);
    for(var i = 0; i < arr.length; i++){
      var t = arr[i];
      if(!t) continue;
      (m[t.projectId] = m[t.projectId] || []).push(t);
    }
    _projTasksIdx.arr = arr; _projTasksIdx.len = arr.length;
    _projTasksIdx.ver = dataVersion; _projTasksIdx.map = m;
  }
  return _projTasksIdx.map[projectId] || [];
}
// Direct children of a task, in stable order.
function childrenOf(taskId){
  return _kidsMap()[taskId || ""] || [];
}
// All descendants (any depth) of a task.
function descendantsOf(taskId){
  var out = [], stack = [taskId], guard = 0;
  while(stack.length && guard < 5000){
    guard++;
    var cur = stack.pop();
    childrenOf(cur).forEach(function(c){ out.push(c); stack.push(c.id); });
  }
  return out;
}
// Deepest level within a task's subtree (relative depth, 1 = no children).
function subtreeDepth(taskId){
  var kids = childrenOf(taskId);
  if(kids.length === 0) return 1;
  var max = 1;
  kids.forEach(function(k){ var d = 1 + subtreeDepth(k.id); if(d > max) max = d; });
  return max;
}
// Can `childId`'s subtree be placed under `parentId` without exceeding MAX_TASK_DEPTH or cycling?
function canBeChildOf(childId, parentId){
  if(!parentId) return true;
  if(childId === parentId) return false;
  var parent = getTask(parentId);
  if(!parent) return false;
  // no cycle: parentId must not be inside childId's subtree
  if(childId && descendantsOf(childId).some(function(d){ return d.id === parentId; })) return false;
  var pLevel = taskLevel(parent);
  var depth = childId ? subtreeDepth(childId) : 1;
  return (pLevel + depth) <= MAX_TASK_DEPTH;
}
// Only top-level tasks may be milestones.
function isTopLevel(task){ return !task.parentId; }
// Is a an ancestor of b? (used to tell containment apart from a real clash)
function isAncestorOf(ancestorId, taskId){
  var cur = getTask(taskId), guard = 0;
  while(cur && cur.parentId && guard < 10){
    if(cur.parentId === ancestorId) return true;
    cur = getTask(cur.parentId); guard++;
  }
  return false;
}
// Two tasks are in a containment relationship if one is an ancestor of the other.
function inSameChain(a, b){
  return isAncestorOf(a.id, b.id) || isAncestorOf(b.id, a.id);
}

/* ---------- parent rollup ----------
   A task that has children does not carry a schedule of its own — everything about it
   is derived from the subtree below it:
     start    = earliest child start
     end      = latest child end
     workdays = that span's working days
     status   = all children done -> 已完成; any child started/done -> 进行中; else 未开始
     owner    = discarded (the work is done by the children's owners)
   Dependencies stay on the parent: they are honored against these derived dates.
   Applied bottom-up so deep trees settle in one pass. Leaf tasks keep their own values. */
function rollupParentDates(){
  // Process deepest levels first so parents see already-settled children.
  var byLevel = {};
  state.milestones.forEach(function(t){
    var lv = taskLevel(t);
    (byLevel[lv] = byLevel[lv] || []).push(t);
  });
  for(var lv = MAX_TASK_DEPTH; lv >= 1; lv--){
    (byLevel[lv] || []).forEach(function(t){
      var allKids = childrenOf(t.id);
      if(allKids.length === 0) return;   // leaf — keeps its own dates, owner and status

      // owner is discarded on a parent: the work belongs to the children
      t.owner = "";

      // status derives from the children
      var doneCount = 0, startedCount = 0;
      allKids.forEach(function(k){
        if(k.status === "done") { doneCount++; startedCount++; }
        else if(k.status === "in_progress" || k.status === "delayed") startedCount++;
      });
      t.status = (doneCount === allKids.length) ? "done"
               : (startedCount > 0 ? "in_progress" : "not_started");

      // dates derive strictly from the children — no residual span of the parent's own
      var kids = allKids.filter(function(k){ return k.start && k.end; });
      if(kids.length === 0) return;      // children unscheduled — leave dates as-is
      var minStart = null, maxEnd = null;
      kids.forEach(function(k){
        if(minStart === null || k.start < minStart) minStart = k.start;
        if(maxEnd === null || k.end > maxEnd) maxEnd = k.end;
      });
      t.start = minStart;
      t.end = maxEnd;
      t.workdays = countWorkdays(minStart, maxEnd);
    });
  }
}
// Ordered flat list of a project's tasks in tree order (parents before children).
// applyDoneFilter: only the on-screen views pass true — export and templates
// must always see the complete tree.
function projectTaskTree(projectId, applyDoneFilter){
  var keep = function(t){ return !applyDoneFilter || taskPassesDoneFilter(t); };
  var out = [];
  // Walks the child index rather than rescanning every task at each node — the old version
  // did a full sweep of the task list per tree node, so the cost grew with
  // (tasks in project) x (tasks overall) and the projects tab rebuilt that for every card.
  function walk(list, level){
    for(var i = 0; i < list.length; i++){
      var t = list[i];
      if(t.projectId !== projectId || !keep(t)) continue;
      out.push({ task: t, level: level });
      walk(childrenOf(t.id), level + 1);
    }
  }
  var mine = tasksOfProject(projectId);
  walk(mine.filter(function(t){ return !t.parentId; }), 1);
  // include orphans (parent missing) as top-level so nothing disappears
  var seen = {};
  out.forEach(function(o){ seen[o.task.id] = true; });
  mine.forEach(function(t){ if(!seen[t.id] && keep(t)) out.push({ task: t, level: 1 }); });
  return out;
}
// Children that survive the current hide-completed filter (used by the list view).
function visibleChildrenOf(taskId){
  return childrenOf(taskId).filter(taskPassesDoneFilter);
}

/* ---------- dependency engine (FS, same-project, auto-shift) ---------- */
// Would adding depId as a prerequisite of taskId create a cycle? (depId already reaches taskId?)
function wouldCreateCycle(taskId, depId){
  if(taskId === depId) return true;
  // Walk the prerequisite graph from depId; if we reach taskId, it's a cycle.
  var stack = [depId];
  var seen = {};
  while(stack.length){
    var cur = stack.pop();
    if(cur === taskId) return true;
    if(seen[cur]) continue;
    seen[cur] = true;
    var t = getTask(cur);
    if(t && t.deps){ t.deps.forEach(function(d){ stack.push(d); }); }
  }
  return false;
}
// Earliest start for a task given its prerequisites: the working day after the latest prereq end.
// Returns null if the task has no (dated) prerequisites.
function earliestStartFromDeps(task){
  if(!task.deps || task.deps.length === 0) return null;
  var latestEnd = null;
  task.deps.forEach(function(depId){
    var dep = getTask(depId);
    if(dep && dep.end){
      if(latestEnd === null || dep.end > latestEnd){ latestEnd = dep.end; }
    }
  });
  if(latestEnd === null) return null;
  // next working day after latestEnd
  var cur = addDays(latestEnd, 1);
  var guard = 0;
  while(dayKind(cur) !== "work" && guard < 400){ cur = addDays(cur, 1); guard++; }
  return cur;
}
// Recompute a task's start (from deps) and end (from workdays), returns true if it changed.
// Next working day at or after the given date.
function nextWorkDay(iso){
  var cur = iso, guard = 0;
  while(dayKind(cur) !== "work" && guard < 400){ cur = addDays(cur, 1); guard++; }
  return cur;
}
function recomputeTaskSchedule(task){
  var es = earliestStartFromDeps(task);
  if(es === null) return false;         // no deps -> leave as-is (manual scheduling)

  // A task with children has no schedule of its own: its span is derived from the subtree.
  // Honoring its dependency therefore means pushing the whole subtree out, not editing the
  // parent's own cells (the next rollup would just overwrite them).
  if(childrenOf(task.id).length > 0){
    if(!task.start || task.start >= es) return false;   // already starts late enough
    var delta = daysBetween(task.start, es);            // positive: move forward only
    var moved = false;
    descendantsOf(task.id).forEach(function(d){
      if(childrenOf(d.id).length > 0) return;           // inner nodes re-derive below
      if(!d.start) return;
      var ns = nextWorkDay(addDays(d.start, delta));
      // keep each leaf's own duration; fall back to its current span, never to 1 day
      var dwd = (typeof d.workdays === "number" && d.workdays >= 1)
        ? d.workdays
        : Math.max(1, countWorkdays(d.start, d.end || d.start));
      var ne = endFromWorkdays(ns, dwd);
      if(d.start !== ns || d.end !== ne){ d.start = ns; d.end = ne; moved = true; }
    });
    if(moved) rollupParentDates();
    return moved;
  }

  var changed = false;
  if(task.start !== es){ task.start = es; changed = true; }
  var wd = (typeof task.workdays === "number" && task.workdays >= 1) ? task.workdays : 1;
  var newEnd = endFromWorkdays(task.start, wd);
  if(task.end !== newEnd){ task.end = newEnd; changed = true; }
  return changed;
}
// Cascade: after a task's dates change, re-flow all downstream dependents (topological, cycle-safe).
function cascadeDependents(changedTaskId){
  // Build dependents map within the same project.
  var iterations = 0;
  var queue = [changedTaskId];
  var maxIter = state.milestones.length * state.milestones.length + 10;
  while(queue.length && iterations < maxIter){
    iterations++;
    var curId = queue.shift();
    // find tasks that depend on curId
    state.milestones.forEach(function(t){
      if(t.deps && t.deps.indexOf(curId) !== -1){
        var changed = recomputeTaskSchedule(t);
        if(changed){ queue.push(t.id); }
      }
    });
  }
}
// Apply full dependency reflow across all tasks (used after import/bulk changes).
function reflowAllDependencies(){
  // Repeatedly pass until stable (bounded).
  var passes = 0;
  var maxPasses = state.milestones.length + 3;
  var anyChange = true;
  while(anyChange && passes < maxPasses){
    anyChange = false; passes++;
    state.milestones.forEach(function(t){
      if(recomputeTaskSchedule(t)){ anyChange = true; }
    });
  }
}

/* ---------- critical path (CPM), per project ---------- */
// Number of working days from ISO a to ISO b inclusive-exclusive style used for slack.
// We reuse countWorkdays (inclusive both ends) and subtract 1 to get "gap" where needed.
// Returns a map: taskId -> { critical:bool, slack:int(workdays) } for scheduled tasks,
// plus per-project summary in _projects: { projId: { workdays, endISO, hasCP } }.
// Memoized on dataVersion: a full CPM pass over every project used to run twice per render
// (once for the bars, once for the connector lines) and again on every pan.
var _cpmCache = { ver: -1, val: null };
function computeCriticalPaths(){
  if(_cpmCache.ver === dataVersion && _cpmCache.val) return _cpmCache.val;
  var result = computeCriticalPathsUncached();
  _cpmCache = { ver: dataVersion, val: result };
  return result;
}
function computeCriticalPathsUncached(){
  var result = { tasks: {}, projects: {} };
  // group scheduled tasks by project
  var byProj = {};
  state.milestones.forEach(function(t){
    if(!t.start || !t.end) return;         // only scheduled tasks
    (byProj[t.projectId] = byProj[t.projectId] || []).push(t);
  });

  Object.keys(byProj).forEach(function(projId){
    var tasks = byProj[projId];
    var idset = {};
    tasks.forEach(function(t){ idset[t.id] = t; });

    // effective deps = deps that are also scheduled & same project
    function effDeps(t){
      return (t.deps || []).filter(function(d){ return idset[d]; });
    }
    // successors within scheduled set
    var succ = {};
    tasks.forEach(function(t){ succ[t.id] = []; });
    tasks.forEach(function(t){
      effDeps(t).forEach(function(d){ succ[d].push(t.id); });
    });

    // ---- Forward pass: earliest finish (EF), in absolute ISO (already scheduled) ----
    // earliestStart = t.start (auto-scheduling keeps this = deps-driven earliest), EF = t.end
    // We take current dates as the earliest schedule.
    var EF = {}, ES = {};
    tasks.forEach(function(t){ ES[t.id] = t.start; EF[t.id] = t.end; });

    // project end = latest EF
    var projEnd = null;
    tasks.forEach(function(t){ if(projEnd === null || t.end > projEnd) projEnd = t.end; });
    result.projects[projId] = { endISO: projEnd, workdays: 0, hasCP: false };

    // ---- Backward pass: latest finish (LF), latest start (LS) ----
    // Process in reverse topological order. Compute via memoized recursion on successors.
    var LF = {};
    var visiting = {};
    function computeLF(id){
      if(LF[id] !== undefined) return LF[id];
      visiting[id] = true;
      var t = idset[id];
      if(succ[id].length === 0){
        LF[id] = projEnd;                    // no successor -> can finish at project end
      } else {
        var minLS = null;
        succ[id].forEach(function(sid){
          var sLF = computeLF(sid);
          var s = idset[sid];
          // LS of successor = LF - (workdays-1) mapped back to a date; then this task's LF = day before successor LS
          var sLS = subtractWorkdays(sLF, (s.workdays || countWorkdays(s.start, s.end)) - 1);
          // this task must finish by the working day before successor's latest start
          var candidate = prevWorkday(sLS);
          if(minLS === null || candidate < minLS) minLS = candidate;
        });
        LF[id] = minLS;
      }
      return LF[id];
    }
    tasks.forEach(function(t){ computeLF(t.id); });

    // ---- Slack + critical flag ----
    var anyCP = false;
    var maxChainLen = 0;
    tasks.forEach(function(t){
      var wd = t.workdays || countWorkdays(t.start, t.end);
      var lf = LF[t.id];
      var ls = subtractWorkdays(lf, wd - 1);          // latest start
      // slack in working days between earliest start (t.start) and latest start (ls)
      var slack = workdayGap(t.start, ls);            // ls - es in workdays (>=0)
      var critical = (slack <= 0);
      if(critical) anyCP = true;
      result.tasks[t.id] = { critical: critical, slack: Math.max(0, slack) };
    });

    // project critical-path length = sum of workdays along the longest chain = end - min start (workdays)
    var minStart = null;
    tasks.forEach(function(t){ if(minStart === null || t.start < minStart) minStart = t.start; });
    result.projects[projId].workdays = (minStart && projEnd) ? countWorkdays(minStart, projEnd) : 0;
    result.projects[projId].hasCP = anyCP;
  });

  return result;
}
// date helpers for CPM (workday-aware)
function prevWorkday(iso){
  var cur = addDays(iso, -1), guard = 0;
  while(dayKind(cur) !== "work" && guard < 400){ cur = addDays(cur, -1); guard++; }
  return cur;
}
// Subtract (n) working days from an end date to get the start date such that [start,end] has n+1 workdays... 
// Here we want: given a latest-finish date, step back (wd-1) working days to the latest-start date.
function subtractWorkdays(endISO, nWorkdaysBack){
  if(nWorkdaysBack <= 0) return endISO;
  var cur = endISO, counted = 0, guard = 0;
  while(counted < nWorkdaysBack && guard < 4000){
    cur = addDays(cur, -1);
    if(dayKind(cur) === "work") counted++;
    guard++;
  }
  return cur;
}
// Working-day gap between two dates (b - a) as a signed count; positive if b after a.
function workdayGap(aISO, bISO){
  if(aISO === bISO) return 0;
  var sign = 1, s = aISO, e = bISO;
  if(bISO < aISO){ sign = -1; s = bISO; e = aISO; }
  // count workdays strictly between s and e (exclusive of s, inclusive of e)
  var n = 0, cur = s, guard = 0;
  while(cur < e && guard < 4000){
    cur = addDays(cur, 1);
    if(dayKind(cur) === "work") n++;
    guard++;
  }
  return sign * n;
}

/* ---------- conflict detection ---------- */
function computeConflicts(){
  var byOwner = {};
  state.milestones.forEach(function(m){
    var owner = (m.owner || "").trim();
    if(!owner) return;
    if(!m.start || !m.end) return;   // scheduling not set yet — can't conflict
    // Archived / paused projects shouldn't raise staffing alarms.
    var mp = getProject(m.projectId);
    if(mp && (projStatus(mp) === "archived" || projStatus(mp) === "paused")) return;
    (byOwner[owner] = byOwner[owner] || []).push(m);
  });
  var conflicts = [];
  var conflictIds = {};
  Object.keys(byOwner).forEach(function(owner){
    // Sorting by start date lets the inner loop stop at the first task that begins after
    // this one ends: everything further along starts later still, so it cannot overlap.
    // Without that break this is a full O(n²) sweep over every pair the owner holds.
    var list = byOwner[owner].slice().sort(function(a, b){
      return a.start < b.start ? -1 : (a.start > b.start ? 1 : 0);
    });
    for(var i = 0; i < list.length; i++){
      var a = list[i], aEnd = a.end;
      for(var j = i + 1; j < list.length; j++){
        var b = list[j];
        if(b.start > aEnd) break;        // sorted: no later task can overlap a either
        // A parent necessarily overlaps its own children — that's containment, not a clash.
        if(inSameChain(a, b)) continue;
        conflicts.push({ owner: owner, a: a, b: b });
        conflictIds[a.id] = true;
        conflictIds[b.id] = true;
      }
    }
  });
  return { conflicts: conflicts, conflictIds: conflictIds };
}

/* ---------- lane packing ---------- */
function packLanes(list){
  var sorted = list.slice().sort(function(a,b){ return a.start < b.start ? -1 : (a.start > b.start ? 1 : 0); });
  var lanes = [];
  sorted.forEach(function(m){
    var placed = false;
    for(var i=0;i<lanes.length;i++){
      var last = lanes[i][lanes[i].length-1];
      if(last.end < m.start){ lanes[i].push(m); placed = true; break; }
    }
    if(!placed){ lanes.push([m]); }
  });
  return lanes;
}

/* ---------- toast ---------- */
function showToast(msg, isErr){
  var root = document.getElementById("toastRoot");
  var el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2600);
}

/* ---------- modal helpers ---------- */
function closeModal(){ document.getElementById("modalRoot").innerHTML = ""; }
function openModalHTML(html){
  document.getElementById("modalRoot").innerHTML =
    '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">' + html + '</div></div>';
  document.getElementById("modalBackdrop").addEventListener("click", function(e){
    if(e.target.id === "modalBackdrop") closeModal();
  });
}

function openConfirm(message, onYes){
  openModalHTML(
    '<div class="modal-head"><h2>确认操作</h2></div>' +
    '<div class="modal-body">' +
      '<p style="font-size:13.5px;color:var(--text-secondary);line-height:1.6;">' + escapeHtml(message) + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="cfCancel">取消</button>' +
        '<button class="btn danger" id="cfYes">确认</button>' +
      '</div>' +
    '</div>'
  );
  document.getElementById("cfCancel").addEventListener("click", closeModal);
  document.getElementById("cfYes").addEventListener("click", function(){ closeModal(); onYes(); });
}

function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

/* ---------- theme modal ---------- */
function openThemeModal(){
  var opts = [
    { key:"dark",     glyph:"🌙", t:"夜晚（深色）", d:"始终使用深色主题" },
    { key:"light",    glyph:"☀️", t:"白天（浅色）", d:"始终使用浅色主题" },
    { key:"system",   glyph:"🖥️", t:"跟随系统",     d:"根据系统的深色/浅色设置自动切换" },
    { key:"schedule", glyph:"⏰", t:"定时切换",     d:"按设定的时间自动在白天/夜晚间切换" }
  ];
  var optHtml = opts.map(function(o){
    var active = themeSettings.mode === o.key ? " active" : "";
    return '<div class="theme-opt' + active + '" data-mode="' + o.key + '">' +
      '<span class="glyph">' + o.glyph + '</span>' +
      '<span class="txt"><span class="t">' + o.t + '</span><span class="d">' + o.d + '</span></span>' +

    '</div>';

  var schedHtml =
    '<div class="theme-sched' + (themeSettings.mode === "schedule" ? " show" : "") + '" id="themeSched">' +
      '<div class="row"><label>白天开始</label><input type="time" id="fDayStart" value="' + themeSettings.dayStart + '"><span>后使用浅色</span></div>' +
      '<div class="row"><label>夜晚开始</label><input type="time" id="fNightStart" value="' + themeSettings.nightStart + '"><span>后使用深色</span></div>' +
    '</div>';

  openModalHTML(
    '<div class="modal-head"><h2>主题设置</h2><button class="btn ghost small" id="mClose">✕</button></div>' +
    '<div class="modal-body">' +
      '<div id="themeOpts">' + optHtml + '</div>' +
      schedHtml +
      '<div class="modal-actions"><button class="btn primary" id="mDone">完成</button></div>' +
    '</div>'
  );

  function selectMode(mode){
    themeSettings.mode = mode;
    document.querySelectorAll("#themeOpts .theme-opt").forEach(function(el){
      el.classList.toggle("active", el.getAttribute("data-mode") === mode);
    });
    document.getElementById("themeSched").classList.toggle("show", mode === "schedule");
    applyTheme();
    refreshThemeWatchers();
    persistThemeSettings();
  }
  document.getElementById("themeOpts").addEventListener("click", function(e){
    var opt = e.target.closest(".theme-opt");
    if(!opt) return;
    selectMode(opt.getAttribute("data-mode"));
  });
  document.getElementById("fDayStart").addEventListener("change", function(e){
    themeSettings.dayStart = e.target.value || "07:00";
    applyTheme(); persistThemeSettings();
  });
  document.getElementById("fNightStart").addEventListener("change", function(e){
    themeSettings.nightStart = e.target.value || "19:00";
    applyTheme(); persistThemeSettings();
  });
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mDone").addEventListener("click", closeModal);
}

/* ---------- calendar modal ---------- */
function openCalendarModal(){
  if(!calViewMonth){
    var now = new Date();
    calViewMonth = { y: now.getFullYear(), m: now.getMonth() };
  }
  // Start editing a fresh draft copy; nothing persists until Save.
  calDraft = {};
  Object.keys(calendarMarks).forEach(function(k){ calDraft[k] = calendarMarks[k]; });
  renderCalendarModal();
}
function calDraftDirty(){
  var a = calDraft || {}, b = calendarMarks || {};
  var ak = Object.keys(a), bk = Object.keys(b);
  if(ak.length !== bk.length) return true;
  for(var i=0;i<ak.length;i++){ if(a[ak[i]] !== b[ak[i]]) return true; }
  return false;
}
function renderCalendarModal(){
  var y = calViewMonth.y, m = calViewMonth.m;
  var first = new Date(y, m, 1);
  var startDow = first.getDay(); // 0 Sun
  var daysInMonth = new Date(y, m+1, 0).getDate();
  var weekdayHeads = ["日","一","二","三","四","五","六"];
  var headHtml = weekdayHeads.map(function(w,i){
    var wc = (i===0||i===6) ? " wkend" : "";
    return '<div class="cal-dow' + wc + '">' + w + '</div>';
  }).join("");

  var cells = "";
  for(var i=0;i<startDow;i++){ cells += '<div class="cal-cell empty"></div>'; }
  for(var d=1; d<=daysInMonth; d++){
    var iso = y + "-" + pad(m+1) + "-" + pad(d);
    var vis = dayVisual(iso, calDraft);
    var isToday = (iso === todayISO());
    var badge = "";
    if(vis === "holiday") badge = '<span class="cal-badge holiday">休</span>';
    else if(vis === "makeup") badge = '<span class="cal-badge makeup">班</span>';
    cells += '<div class="cal-cell ' + vis + (isToday ? " today" : "") + '" data-date="' + iso + '">' +
      '<span class="cal-num">' + d + '</span>' + badge + '</div>';
  }

  var presetOpts = '<option value="">选择预设模板…</option>' +
    Object.keys(HOLIDAY_PRESETS).map(function(k){
      return '<option value="' + k + '">' + escapeHtml(HOLIDAY_PRESETS[k].label) + '</option>';
    }).join("");

  var dirty = calDraftDirty();
  var title = y + "年" + (m+1) + "月";
  openModalHTML(
    '<div class="modal-head"><h2>日历设置</h2><button class="btn ghost small" id="mClose">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="cal-preset-row">' +
        '<select id="calPreset" class="filter-select">' + presetOpts + '</select>' +
        '<button class="btn small" id="calApplyPreset">应用</button>' +
        '<button class="btn ghost small" id="calClearAll">清空全部</button>' +
      '</div>' +
      '<div class="cal-nav">' +
        '<button class="btn ghost small" id="calPrev">‹ 上月</button>' +
        '<span class="cal-title">' + title + '</span>' +
        '<button class="btn ghost small" id="calNext">下月 ›</button>' +
      '</div>' +
      '<div class="cal-grid cal-head">' + headHtml + '</div>' +
      '<div class="cal-grid cal-body">' + cells + '</div>' +
      '<div class="cal-legend">' +
        '<span><i class="lg holiday"></i>节假日（放假）</span>' +
        '<span><i class="lg makeup"></i>调休上班</span>' +
        '<span><i class="lg weekend"></i>普通周末</span>' +
      '</div>' +
      '<div class="cal-hint">点击日期切换状态（工作日→放假；周末→调休上班；再点恢复）。<span id="calDirtyHint">' + (dirty ? '<span class="cal-dirty">· 有未保存的修改</span>' : '') + '</span></div>' +
      '<div class="modal-actions"><button class="btn" id="mCancel">取消</button><button class="btn primary" id="mSave">保存</button></div>' +
    '</div>'
  );

  function closeCalendar(){ calDraft = null; closeModal(); }

  document.getElementById("mClose").addEventListener("click", function(){
    if(calDraftDirty()){
      openConfirm("有未保存的日历修改，确定放弃并关闭？", function(){ closeCalendar(); });
    } else { closeCalendar(); }
  });
  document.getElementById("mCancel").addEventListener("click", function(){
    if(calDraftDirty()){
      openConfirm("有未保存的日历修改，确定放弃？", function(){ closeCalendar(); });
    } else { closeCalendar(); }
  });
  document.getElementById("mSave").addEventListener("click", function(){
    calendarMarks = calDraft || {};
    invalidateCalendarCaches();
    calDraft = null;
    persistCalendar();
    renderAll();
    closeModal();
    showToast("日历已保存");
  });
  document.getElementById("calPrev").addEventListener("click", function(){
    calViewMonth.m--; if(calViewMonth.m < 0){ calViewMonth.m = 11; calViewMonth.y--; }
    renderCalendarModal();
  });
  document.getElementById("calNext").addEventListener("click", function(){
    calViewMonth.m++; if(calViewMonth.m > 11){ calViewMonth.m = 0; calViewMonth.y++; }
    renderCalendarModal();
  });
  document.getElementById("calApplyPreset").addEventListener("click", function(){
    var key = document.getElementById("calPreset").value;
    if(!key || !HOLIDAY_PRESETS[key]){ showToast("请先选择一个预设模板", true); return; }
    var preset = HOLIDAY_PRESETS[key];
    // Merge preset into draft (adds holidays + makeups; keeps existing custom marks).
    preset.holidays.forEach(function(iso){ calDraft[iso] = "holiday"; });
    preset.makeups.forEach(function(iso){ calDraft[iso] = "workday"; });
    // jump view to the preset's first holiday month for feedback
    if(preset.holidays.length){
      var d = toDate(preset.holidays[0]);
      calViewMonth = { y: d.getFullYear(), m: d.getMonth() };
    }
    renderCalendarModal();
    showToast("已应用「" + preset.label + "」（保存后生效）");
  });
  document.getElementById("calClearAll").addEventListener("click", function(){
    openConfirm("清空当前所有日历标记（草稿）？保存后才会真正生效。", function(){
      calDraft = {};
      renderCalendarModal();
    });
  });
  document.querySelectorAll(".cal-cell[data-date]").forEach(function(cell){
    cell.addEventListener("click", function(){
      var iso = cell.getAttribute("data-date");
      cycleDateMark(iso);            // edits calDraft
      repaintCalCell(cell, iso);     // update just this cell — no full re-render, no flicker
      refreshCalDirtyHint();
    });
  });
}
// Repaint one calendar cell to match its current draft state.
function repaintCalCell(cell, iso){
  var vis = dayVisual(iso, calDraft);
  var isToday = (iso === todayISO());
  cell.className = "cal-cell " + vis + (isToday ? " today" : "");
  var d = toDate(iso);
  var badge = "";
  if(vis === "holiday") badge = '<span class="cal-badge holiday">休</span>';
  else if(vis === "makeup") badge = '<span class="cal-badge makeup">班</span>';
  cell.innerHTML = '<span class="cal-num">' + d.getDate() + '</span>' + badge;
}
// Update the "unsaved changes" hint text without rebuilding the modal.
function refreshCalDirtyHint(){
  var hint = document.getElementById("calDirtyHint");
  if(!hint) return;
  hint.innerHTML = calDraftDirty() ? '<span class="cal-dirty">· 有未保存的修改</span>' : '';
}
// Cycle logic on the DRAFT: workday -> holiday -> (clear). weekend -> workday(makeup) -> (clear).
function cycleDateMark(iso){
  var cur = calDraft[iso];
  if(isWeekendDate(iso)){
    if(!cur){ calDraft[iso] = "workday"; }
    else { delete calDraft[iso]; }
  } else {
    if(!cur){ calDraft[iso] = "holiday"; }
    else { delete calDraft[iso]; }
  }
}

/* ---------- template modals ---------- */
function openSaveTemplateModal(projectId){
  var p = getProject(projectId);
  if(!p){ return; }
  var taskCount = state.milestones.filter(function(m){ return m.projectId === projectId; }).length;
  openModalHTML(
    '<div class="modal-head"><h2>存为模板</h2><button class="btn ghost small" id="mClose">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="field"><label>模板名称 *</label><input type="text" id="fTplName" value="' + escapeHtml(p.name) + '" placeholder="例如：ADAS 标准交付流程"></div>' +
      '<div class="tpl-note">将保存项目信息（名称/客户/平台/颜色）与 ' + taskCount + ' 个任务的标题、类型、工时、状态。<br>不保存具体的开始/结束日期和责任人（从模板创建时留空）。</div>' +
      '<div class="field-error" id="fErr"></div>' +
      '<div class="modal-actions"><button class="btn" id="mCancel">取消</button><button class="btn primary" id="mSave">保存模板</button></div>' +
    '</div>'
  );
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mCancel").addEventListener("click", closeModal);
  document.getElementById("mSave").addEventListener("click", function(){
    var name = document.getElementById("fTplName").value.trim();
    if(!name){ var e=document.getElementById("fErr"); e.textContent="请填写模板名称"; e.style.display="block"; return; }
    var tpl = buildTemplateFromProject(projectId, name);
    templates.push(tpl);
    persistTemplates();
    closeModal();
    showToast("模板已保存");
  });
}

function openTemplateManagerModal(){
  var listHtml;
  if(templates.length === 0){
    listHtml = '<div class="tpl-empty">还没有模板。可在「项目列表」中点击某个项目的「存为模板」，或从现有项目导出。</div>';
  } else {
    listHtml = templates.map(function(tpl){
      var meta = tpl.projMeta || {};
      var sub = [meta.client, meta.platform].filter(Boolean).join(" · ");
      return '<div class="tpl-item">' +
        '<span class="swatch" style="background:' + (meta.color || "#5B8DEF") + '"></span>' +
        '<div class="tpl-info"><div class="tpl-name">' + escapeHtml(tpl.name) + '</div>' +
          '<div class="tpl-sub">' + (sub ? escapeHtml(sub) + ' · ' : '') + (tpl.tasks ? tpl.tasks.length : 0) + ' 个任务</div></div>' +
        '<button class="btn small primary" data-tpl-use="' + tpl.id + '">使用</button>' +
        '<button class="btn ghost small" data-tpl-del="' + tpl.id + '">删除</button>' +
      '</div>';
    }).join("");
  }
  openModalHTML(
    '<div class="modal-head"><h2>模板管理</h2><button class="btn ghost small" id="mClose">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="tpl-list">' + listHtml + '</div>' +
      '<div class="modal-actions"><button class="btn primary" id="mDone">完成</button></div>' +
    '</div>'
  );
  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mDone").addEventListener("click", closeModal);
  document.querySelectorAll("[data-tpl-use]").forEach(function(el){
    el.addEventListener("click", function(){
      var tpl = templates.find(function(x){ return x.id === el.getAttribute("data-tpl-use"); });
      if(tpl){ openProjectModal(null, { selectedTpl: tpl }); }
    });
  });
  document.querySelectorAll("[data-tpl-del]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-tpl-del");
      var tpl = templates.find(function(x){ return x.id === id; });
      closeModal();
      openConfirm("删除模板「" + (tpl ? tpl.name : "") + "」？此操作不可撤销。", function(){
        templates = templates.filter(function(x){ return x.id !== id; });
        persistTemplates();
        showToast("模板已删除");
        openTemplateManagerModal();
      });
    });
  });
}

/* ---------- project modal ---------- */
// opts: { draft:{name,client,platform,color}, selectedTpl:templateObj }
function openProjectModal(existing, opts){
  opts = opts || {};
  var isEdit = !!existing;
  var draft = opts.draft || null;
  var selectedTpl = opts.selectedTpl || null;
  var base;
  if(existing){ base = existing; }
  else if(draft){ base = draft; }
  else if(selectedTpl && selectedTpl.projMeta){
    var tm = selectedTpl.projMeta;
    base = { id:null, name: tm.name || selectedTpl.name || "", client: tm.client || "", platform: tm.platform || "", color: tm.color || PROJ_COLORS[state.projects.length % PROJ_COLORS.length] };
  }
  else { base = { id: null, name: "", client: "", platform: "", color: PROJ_COLORS[state.projects.length % PROJ_COLORS.length] }; }
  var p = base;
  var swatches = PROJ_COLORS.map(function(c){
    var sel = c === p.color ? " selected" : "";
    return '<button type="button" class="swatch-btn' + sel + '" data-color="' + c + '" style="background:' + c + '"></button>';
  }).join("");

  var tplBarHtml = "";
  if(!isEdit){
    if(selectedTpl){
      var meta = selectedTpl.projMeta || {};
      var sub = [meta.client, meta.platform].filter(Boolean).join(" · ");
      tplBarHtml = '<div class="tpl-selectedbar">' +
        '<span class="swatch" style="background:' + (meta.color || "#5B8DEF") + '"></span>' +
        '<div class="tpl-sel-info"><div class="tpl-sel-name">已选模板：' + escapeHtml(selectedTpl.name) + '</div>' +
          '<div class="tpl-sel-sub">' + (sub ? escapeHtml(sub) + ' · ' : '') + (selectedTpl.tasks ? selectedTpl.tasks.length : 0) + ' 个任务（日期与责任人留空）</div></div>' +
        '<button class="btn ghost small" id="fChangeTpl">更换</button>' +
        '<button class="btn ghost small" id="fClearTpl">移除</button>' +
      '</div>';
    } else if(templates.length > 0){
      tplBarHtml = '<div class="tpl-frombar"><span>已有 ' + templates.length + ' 个模板</span><button class="btn small" id="fFromTpl">从模板创建 ›</button></div>';
    }
  }

  openModalHTML(
    '<div class="modal-head"><h2>' + (isEdit ? "编辑项目" : "新建项目") + '</h2>' +
      '<button class="btn ghost small" id="mClose">✕</button></div>' +
    '<div class="modal-body">' +
      tplBarHtml +
      '<div class="field"><label>项目名称 *</label><input type="text" id="fName" value="' + escapeHtml(p.name) + '" placeholder="例如：BYD · B12E06"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>客户</label><input type="text" id="fClient" value="' + escapeHtml(p.client || "") + '" placeholder="选填"></div>' +
        '<div class="field"><label>硬件平台</label><input type="text" id="fPlatform" value="' + escapeHtml(p.platform || "") + '" placeholder="选填"></div>' +
      '</div>' +
      '<div class="field"><label>项目状态</label><select id="fProjStatus">' +
        Object.keys(PROJ_STATUS_LABEL).map(function(k){
          return '<option value="' + k + '"' + (projStatus(p) === k ? " selected" : "") + '>' + PROJ_STATUS_LABEL[k] + '</option>';
        }).join("") +
      '</select><div class="field-hint">「已暂停」「归档」的项目默认不在各视图中显示，可用筛选查看</div></div>' +
      '<div class="field"><label>标识颜色</label><div class="swatch-picker" id="fColor">' + swatches + '</div></div>' +
      '<div class="field-error" id="fErr"></div>' +
      '<div class="modal-actions">' +
        (isEdit ? '<button class="btn danger" id="mDelete" style="margin-right:auto;">删除项目</button>' : '') +
        (isEdit ? '<button class="btn" id="mSaveTpl">存为模板</button>' : '') +
        '<button class="btn" id="mCancel">取消</button>' +
        '<button class="btn primary" id="mSave">保存</button>' +
      '</div>' +
    '</div>'
  );

  var chosenColor = p.color;
  document.getElementById("fColor").addEventListener("click", function(e){
    var btn = e.target.closest(".swatch-btn");
    if(!btn) return;
    chosenColor = btn.getAttribute("data-color");
    document.querySelectorAll("#fColor .swatch-btn").forEach(function(b){ b.classList.remove("selected"); });
    btn.classList.add("selected");
  });

  // Snapshot current field values so they survive a trip to the template picker.
  function snapshotDraft(){
    return {
      name: document.getElementById("fName").value,
      client: document.getElementById("fClient").value,
      platform: document.getElementById("fPlatform").value,
      color: chosenColor
    };
  }

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mCancel").addEventListener("click", closeModal);

  var fromTplBtn = document.getElementById("fFromTpl");
  if(fromTplBtn){
    fromTplBtn.addEventListener("click", function(){
      openTemplatePickerModal(snapshotDraft(), selectedTpl);
    });
  }
  var changeTplBtn = document.getElementById("fChangeTpl");
  if(changeTplBtn){
    changeTplBtn.addEventListener("click", function(){
      openTemplatePickerModal(snapshotDraft(), selectedTpl);
    });
  }
  var clearTplBtn = document.getElementById("fClearTpl");
  if(clearTplBtn){
    clearTplBtn.addEventListener("click", function(){
      openProjectModal(null, { draft: snapshotDraft(), selectedTpl: null });
    });
  }

  if(isEdit){
    document.getElementById("mSaveTpl").addEventListener("click", function(){
      openSaveTemplateModal(p.id);
    });
    document.getElementById("mDelete").addEventListener("click", function(){
      closeModal();
      openConfirm("删除项目「" + p.name + "」将同时删除其下所有里程碑，此操作不可撤销。", function(){
        mutate(function(){
          state.projects = state.projects.filter(function(x){ return x.id !== p.id; });
          state.milestones = state.milestones.filter(function(x){ return x.projectId !== p.id; });
        });
        showToast("项目已删除");
      });
    });
  }
  document.getElementById("mSave").addEventListener("click", function(){
    var name = document.getElementById("fName").value.trim();
    var client = document.getElementById("fClient").value.trim();
    var platform = document.getElementById("fPlatform").value.trim();
    var pstatus = document.getElementById("fProjStatus").value;
    if(!name){
      var err = document.getElementById("fErr");
      err.textContent = "请填写项目名称";
      err.style.display = "block";
      return;
    }
    if(isEdit){
      mutate(function(){
        p.name = name; p.client = client; p.platform = platform; p.color = chosenColor; p.status = pstatus;
      });
      showToast("项目已更新");
    } else if(selectedTpl){
      // Create from template but honor edited project fields.
      mutate(function(){
        var np = createProjectFromTemplate(selectedTpl, name);
        np.client = client; np.platform = platform; np.color = chosenColor; np.status = pstatus;
      });
      state.activeTab = "projects";
      showToast("已从模板创建项目");
    } else {
      mutate(function(){
        state.projects.push({ id: uid(), name: name, client: client, platform: platform, color: chosenColor, status: pstatus });
      });
      showToast("项目已创建");
    }
    closeModal();
  });
}

/* ---------- template picker (select only, returns to project modal) ---------- */
function openTemplatePickerModal(draft, currentSel){
  var listHtml;
  if(templates.length === 0){
    listHtml = '<div class="tpl-empty">还没有模板。可先在「项目列表」中把某个项目「存为模板」。</div>';
  } else {
    listHtml = templates.map(function(tpl){
      var meta = tpl.projMeta || {};
      var sub = [meta.client, meta.platform].filter(Boolean).join(" · ");
      var isSel = currentSel && currentSel.id === tpl.id;
      return '<div class="tpl-pick' + (isSel ? " sel" : "") + '" data-tpl-pick="' + tpl.id + '">' +
        '<span class="swatch" style="background:' + (meta.color || "#5B8DEF") + '"></span>' +
        '<div class="tpl-info"><div class="tpl-name">' + escapeHtml(tpl.name) + '</div>' +
          '<div class="tpl-sub">' + (sub ? escapeHtml(sub) + ' · ' : '') + (tpl.tasks ? tpl.tasks.length : 0) + ' 个任务</div></div>' +
        '<span class="tpl-radio"></span>' +
      '</div>';
    }).join("");
  }
  openModalHTML(
    '<div class="modal-head"><h2>选择模板</h2><button class="btn ghost small" id="mClose">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="tpl-pick-hint">点击选择一个模板，完成后返回项目创建页。</div>' +
      '<div class="tpl-list">' + listHtml + '</div>' +
      '<div class="modal-actions">' +
        '<button class="btn" id="mBack">返回</button>' +
        '<button class="btn primary" id="mDone">完成</button>' +
      '</div>' +
    '</div>'
  );

  var picked = currentSel || null;
  document.querySelectorAll("[data-tpl-pick]").forEach(function(el){
    el.addEventListener("click", function(){
      var id = el.getAttribute("data-tpl-pick");
      picked = templates.find(function(x){ return x.id === id; }) || null;
      document.querySelectorAll(".tpl-pick").forEach(function(x){ x.classList.remove("sel"); });
      el.classList.add("sel");
    });
  });

  function backToProject(sel){
    openProjectModal(null, { draft: draft, selectedTpl: sel });
  }
  document.getElementById("mClose").addEventListener("click", function(){ backToProject(currentSel); });
  document.getElementById("mBack").addEventListener("click", function(){ backToProject(currentSel); });
  document.getElementById("mDone").addEventListener("click", function(){ backToProject(picked); });
}

/* ---------- task / milestone modal ---------- */
function openMilestoneModal(existing, presetProjectId, presetParentId){
  if(state.projects.length === 0){
    showToast("请先创建一个项目", true);
    return;
  }
  var isEdit = !!existing;
  var m = existing || {
    id: null, projectId: presetProjectId || state.projects[0].id, title: "", owner: "",
    start: todayISO(), end: addDays(todayISO(), 5), status: "not_started",
    isMilestone: !presetParentId, parentId: presetParentId || null
  };
  var parentTask = m.parentId ? getTask(m.parentId) : null;
  var isChild = !!parentTask;
  var myLevel = isChild ? (taskLevel(parentTask) + 1) : 1;
  var projOptions = state.projects.map(function(p){
    var sel = p.id === m.projectId ? " selected" : "";
    return '<option value="' + p.id + '"' + sel + '>' + escapeHtml(p.name) + '</option>';
  }).join("");
  var statusOptions = Object.keys(STATUS_LABEL).map(function(k){
    var sel = k === m.status ? " selected" : "";
    return '<option value="' + k + '"' + sel + '>' + STATUS_LABEL[k] + '</option>';
  }).join("");
  var heading = isEdit ? "编辑任务" : (isChild ? "新建子任务" : "新建里程碑");

  // A task with children is scheduled by its subtree: owner, dates, workdays and status
  // are all derived, so the form shows them read-only rather than inviting edits that
  // the next rollup would overwrite. Title, project and dependencies stay editable.
  var kidCount = isEdit && m.id ? childrenOf(m.id).length : 0;
  var isParent = kidCount > 0;
  var ro = isParent ? " disabled" : "";
  var derivedNote = isParent
    ? '<div class="parent-derived-note">本任务有 ' + kidCount + ' 个子任务，开始/结束日期、工时与状态由子任务推导，责任人由子任务承担，均不在此编辑。前置任务依赖仍可设置，将按推导出的日期排期。</div>'
    : '';

  // Parent context bar (child tasks only)
  var parentBar = isChild
    ? '<div class="parent-bar"><span class="pb-icon">↳</span><div class="pb-info">' +
        '<div class="pb-name">父任务：' + escapeHtml(parentTask.title) + '</div>' +
        '<div class="pb-sub">第 ' + myLevel + ' 级任务（最多 ' + MAX_TASK_DEPTH + ' 级）</div></div>' +
        (isEdit ? '<button class="btn ghost small" id="fClearParent">升为顶级</button>' : '') +
      '</div>'
    : '';

  // Milestone toggle: only top-level tasks may be milestones.
  // Type follows level: a top-level task IS a milestone, a child never is. No toggle needed.
  var msField = isChild
    ? '<div class="field ms-toggle-field"><div class="ms-toggle disabled">' +
        '<span class="ms-check">·</span>' +
        '<span class="ms-toggle-txt"><span class="tt">普通任务（第 ' + myLevel + ' 级）</span>' +
        '<span class="dd">子任务一律为普通任务；升为顶级任务后会自动成为里程碑</span></span>' +
      '</div></div>'
    : '<div class="field ms-toggle-field"><div class="ms-toggle auto">' +
        '<span class="ms-check on">◆</span>' +
        '<span class="ms-toggle-txt"><span class="tt">里程碑任务（顶级）</span>' +
        '<span class="dd">顶级任务即里程碑，在时间线上显示 ◆ 图标；添加父任务后将自动变为普通任务</span></span>' +
      '</div></div>';

  openModalHTML(
    '<div class="modal-head"><h2>' + heading + '</h2>' +
      '<button class="btn ghost small" id="mClose">✕</button></div>' +
    '<div class="modal-body">' +
      parentBar +
      '<div class="field"><label>所属项目 *</label><select id="fProj"' + (isChild ? " disabled" : "") + '>' + projOptions + '</select>' +
        (isChild ? '<div class="field-hint">子任务跟随父任务所在项目</div>' : '') + '</div>' +
      '<div class="field"><label>任务标题 *</label><input type="text" id="fTitle" value="' + escapeHtml(m.title) + '" placeholder="例如：SIL 仿真测试"></div>' +
      msField +
      derivedNote +
      '<div class="field"><label>责任人' + (isParent ? '（由子任务承担）' : '') + '</label><input type="text" id="fOwner" value="' + escapeHtml(isParent ? "" : m.owner) + '" placeholder="例如：王工（用于检测人力冲突）"' + ro + '></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>开始日期 *' + (isParent ? '（推导）' : '') + '</label><input type="date" id="fStart" value="' + m.start + '"' + ro + '></div>' +
        '<div class="field"><label>结束日期 *' + (isParent ? '（推导）' : '') + '</label><input type="date" id="fEnd" value="' + m.end + '"' + ro + '></div>' +
      '</div>' +
      '<div class="field">' +
        '<label>工时（工作日）' + (isParent ? '（推导）' : '') + '</label>' +
        '<input type="number" id="fWorkdays" min="1" step="1" value="' + (m.workdays || countWorkdays(m.start, m.end)) + '"' + ro + '>' +
        '<div class="field-hint" id="fWorkHint">设置工时后自动按开始日期推算结束日期，自动跳过节假日与周末（调休上班日计为工作日）</div>' +
      '</div>' +
      '<div class="field" id="fDepsField">' +
        '<label>前置任务（依赖）</label>' +
        '<div class="deps-box" id="fDepsBox"></div>' +
        '<div class="field-hint">选择需先完成的任务；本任务将自动从前置全部完成后的下一个工作日开始。前置改期时本任务及其下游会自动顺延。</div>' +
      '</div>' +
      '<div class="field"><label>状态' + (isParent ? '（由子任务推导）' : '') + '</label><select id="fStatus"' + ro + '>' + statusOptions + '</select></div>' +
      '<div class="field-error" id="fErr"></div>' +
      '<div class="modal-actions">' +
        (isEdit ? '<button class="btn danger" id="mDelete" style="margin-right:auto;">删除</button>' : '') +
        '<button class="btn" id="mCancel">取消</button>' +
        '<button class="btn primary" id="mSave">保存</button>' +
      '</div>' +
    '</div>'
  );

  var chosenParentId = m.parentId || null;
  var clearParentBtn = document.getElementById("fClearParent");
  if(clearParentBtn){
    clearParentBtn.addEventListener("click", function(){
      chosenParentId = null;
      closeModal();
      // reopen as a top-level task edit so the milestone toggle becomes available
      mutate(function(){ m.parentId = null; });
      openMilestoneModal(m);
      showToast("已升为顶级任务");
    });
  }

  var elStart = document.getElementById("fStart");
  var elEnd = document.getElementById("fEnd");
  var elWork = document.getElementById("fWorkdays");
  var elHint = document.getElementById("fWorkHint");

  function updateHint(){
    var s = elStart.value, e = elEnd.value;
    if(s && e && e >= s){
      var actual = countWorkdays(s, e);
      var span = daysBetween(s, e) + 1;
      var off = span - actual;
      elHint.textContent = "区间共 " + span + " 天，其中 " + actual + " 个工作日" + (off > 0 ? "，跳过 " + off + " 天（节假日/周末）" : "");
    }
  }
  // start or workdays changed -> recompute end
  function recalcEndFromWork(){
    var s = elStart.value;
    var h = parseInt(elWork.value, 10);
    if(!s || !h || h < 1) return;
    elEnd.value = endFromWorkdays(s, h);
    updateHint();
  }
  // end changed -> recompute workdays
  function recalcWorkFromDates(){
    var s = elStart.value, e = elEnd.value;
    if(!s || !e || e < s) return;
    elWork.value = countWorkdays(s, e);
    updateHint();
  }
  elWork.addEventListener("input", recalcEndFromWork);
  elStart.addEventListener("change", function(){
    // keep the workday count, shift end
    if(parseInt(elWork.value,10) >= 1){ recalcEndFromWork(); }
    else { recalcWorkFromDates(); }
  });
  elEnd.addEventListener("change", recalcWorkFromDates);
  updateHint();

  // ----- dependencies -----
  var chosenDeps = (m.deps || []).slice();
  var elProj = document.getElementById("fProj");
  var elDepsBox = document.getElementById("fDepsBox");
  var elDepsField = document.getElementById("fDepsField");

  function eligibleDepTasks(){
    var projId = elProj.value;
    return state.milestones.filter(function(t){
      if(t.projectId !== projId) return false;      // same project only
      if(isEdit && t.id === m.id) return false;      // not self
      // exclude tasks that would create a cycle if chosen as prereq of this task
      if(isEdit && wouldCreateCycle(m.id, t.id)) return false;
      return true;
    });
  }
  function renderDepsBox(){
    var list = eligibleDepTasks();
    if(list.length === 0){
      elDepsBox.innerHTML = '<div class="deps-empty">该项目暂无其它可选任务</div>';
      return;
    }
    elDepsBox.innerHTML = list.map(function(t){
      var checked = chosenDeps.indexOf(t.id) !== -1;
      var dateTxt = (t.start && t.end) ? (fmtShort(t.start) + "–" + fmtShort(t.end)) : "未排期";
      return '<label class="dep-item' + (checked ? " on" : "") + '" data-dep="' + t.id + '">' +
        '<span class="dep-check">' + (checked ? "✓" : "") + '</span>' +
        '<span class="dep-title">' + (t.isMilestone ? '<span class="ms-tag">◆</span>' : '') + escapeHtml(t.title) + '</span>' +
        '<span class="dep-dates">' + dateTxt + '</span>' +
      '</label>';
    }).join("");
    elDepsBox.querySelectorAll(".dep-item").forEach(function(el){
      el.addEventListener("click", function(){
        var id = el.getAttribute("data-dep");
        var idx = chosenDeps.indexOf(id);
        if(idx === -1){ chosenDeps.push(id); } else { chosenDeps.splice(idx, 1); }
        renderDepsBox();
        applyDepAutoSchedule();
      });
    });
  }
  // When deps chosen, auto-set start (and end from workdays) in the form, and lock start field.
  function applyDepAutoSchedule(){
    if(chosenDeps.length === 0){
      elStart.readOnly = false;
      elStart.classList.remove("locked");
      return;
    }
    // compute latest end among chosen deps
    var latestEnd = null;
    chosenDeps.forEach(function(id){
      var dep = getTask(id);
      if(dep && dep.end){ if(latestEnd === null || dep.end > latestEnd) latestEnd = dep.end; }
    });
    if(latestEnd){
      var cur = addDays(latestEnd, 1), guard = 0;
      while(dayKind(cur) !== "work" && guard < 400){ cur = addDays(cur, 1); guard++; }
      elStart.value = cur;
      var h = parseInt(elWork.value, 10) || 1;
      elEnd.value = endFromWorkdays(cur, h);
      updateHint();
    }
    // start is driven by deps now
    elStart.readOnly = true;
    elStart.classList.add("locked");
  }
  elProj.addEventListener("change", function(){
    // switching project invalidates cross-project deps
    chosenDeps = [];
    renderDepsBox();
    applyDepAutoSchedule();
  });
  // when workdays change and deps set, keep start, refresh end (already handled by recalcEndFromWork)
  renderDepsBox();
  applyDepAutoSchedule();

  document.getElementById("mClose").addEventListener("click", closeModal);
  document.getElementById("mCancel").addEventListener("click", closeModal);
  if(isEdit){
    document.getElementById("mDelete").addEventListener("click", function(){
      closeModal();
      var kids = descendantsOf(m.id);
      var msg = kids.length
        ? "删除任务「" + m.title + "」将同时删除其 " + kids.length + " 个子任务，此操作不可撤销。"
        : "删除任务「" + m.title + "」？此操作不可撤销。";
      openConfirm(msg, function(){
        mutate(function(){
          var removeIds = {};
          removeIds[m.id] = true;
          kids.forEach(function(k){ removeIds[k.id] = true; });
          state.milestones = state.milestones.filter(function(x){ return !removeIds[x.id]; });
          // remove deleted tasks from any dependents' deps, then reflow those
          state.milestones.forEach(function(t){
            if(t.deps && t.deps.some(function(d){ return removeIds[d]; })){
              t.deps = t.deps.filter(function(d){ return !removeIds[d]; });
              recomputeTaskSchedule(t);
              cascadeDependents(t.id);
            }
          });
          rollupParentDates();
        });
        showToast(kids.length ? "任务及其子任务已删除" : "任务已删除");
      });
    });
  }
  document.getElementById("mSave").addEventListener("click", function(){
    var projectId = document.getElementById("fProj").value;
    var title = document.getElementById("fTitle").value.trim();
    var owner = document.getElementById("fOwner").value.trim();
    var start = document.getElementById("fStart").value;
    var end = document.getElementById("fEnd").value;
    var status = document.getElementById("fStatus").value;
    var err = document.getElementById("fErr");
    if(!title || !start || !end){
      err.textContent = "请填写标题、开始日期与结束日期"; err.style.display = "block"; return;
    }
    if(end < start){
      err.textContent = "结束日期不能早于开始日期"; err.style.display = "block"; return;
    }
    var workdays = countWorkdays(start, end);
    // Child tasks inherit the parent's project and can never be milestones.
    if(chosenParentId){
      var pt = getTask(chosenParentId);
      if(pt) projectId = pt.projectId;
    }
    // Only keep deps that belong to the current project (defensive).
    var finalDeps = chosenDeps.filter(function(id){
      var t = getTask(id); return t && t.projectId === projectId;
    });
    if(isEdit){
      mutate(function(){
        m.projectId = projectId; m.title = title; m.owner = owner; m.start = start; m.end = end; m.status = status; m.isMilestone = !chosenParentId; m.workdays = workdays; m.deps = finalDeps; m.parentId = chosenParentId || null;
        // moving a parent between projects takes its subtree along
        descendantsOf(m.id).forEach(function(d){ d.projectId = projectId; });
        recomputeTaskSchedule(m);     // ensure this task's own dates honor its deps
        cascadeDependents(m.id);       // reflow downstream
        rollupParentDates();           // parents must span their children
      });
      showToast("任务已更新");
    } else {
      mutate(function(){
        var nt = { id: uid(), projectId: projectId, title: title, owner: owner, start: start, end: end, status: status, isMilestone: !chosenParentId, workdays: workdays, deps: finalDeps, parentId: chosenParentId || null };
        state.milestones.push(nt);
        recomputeTaskSchedule(nt);
        cascadeDependents(nt.id);
        rollupParentDates();
      });
      showToast(chosenParentId ? "子任务已创建" : "里程碑已创建");
    }
    closeModal();
  });
}

/* ---------- render: stats ---------- */
function renderStats(conflictsInfo){
