<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目里程碑指挥台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* The webfont stylesheet is attached after parsing rather than written as a <link> in the
   markup. As a render-blocking cross-origin stylesheet it held first paint back by about a
   quarter of a second; appended this way it never blocks. The font stack falls back to
   PingFang SC / Microsoft YaHei, which readers already have, and display=swap means text is
   never invisible while the webfont is on its way. Done with a script element rather than a
   link[onload] attribute so it keeps working under a strict content-security policy. */
(function(){
  var href = "https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700" +
             "&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap";
  function attach(){
    var l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = href;
    document.head.appendChild(l);
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", attach, { once: true });
  } else {
    attach();
  }
})();
</script>
<style>
:root{
  --day-w:26px;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --font-sans:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
/* ===== dark theme (default) ===== */
:root, [data-theme="dark"]{
  --bg-base:#0E1218;
  --bg-panel:#151C26;
  --bg-raised:#1C2531;
  --bg-raised-2:#232D3B;
  --grid-line:#26303F;
  --grid-line-strong:#37445A;
  --text-primary:#ECF0F5;
  --text-secondary:#8B96AA;
  --text-dim:#57627A;
  --accent-ok:#3ED6B5;
  --accent-warn:#F0A93B;
  --accent-crit:#FF5C6C;
  --accent-crit-bg:rgba(255,92,108,0.12);
  --proj-1:#5B8DEF;
  --proj-2:#B980F0;
  --proj-3:#4FD1C5;
  --proj-4:#F2789F;
  --proj-5:#FDBA74;
  --proj-6:#8BE05A;
  --bar-text:#0B1016;
  --glow-a:rgba(62,214,181,0.06);
  --glow-b:rgba(91,141,239,0.07);
  --daybg-weekend:rgba(255,255,255,0.03);
  --daybg-holiday:rgba(255,92,108,0.13);
  --daybg-makeup:rgba(62,214,181,0.10);
  --daybg-makeup-line:rgba(62,214,181,0.55);
  --dep-line:#7C8BA8;
  --cp-line:#F5B301;
  --cp-glow:rgba(245,179,1,0.5);
}
/* ===== light theme ===== */
[data-theme="light"]{
  --bg-base:#F4F6FA;
  --bg-panel:#FFFFFF;
  --bg-raised:#EEF1F6;
  --bg-raised-2:#E4E9F1;
  --grid-line:#DDE3EC;
  --grid-line-strong:#C3CCDA;
  --text-primary:#1C2430;
  --text-secondary:#5E6B80;
  --text-dim:#94A0B3;
  --accent-ok:#12A98C;
  --accent-warn:#C77A12;
  --accent-crit:#DC3545;
  --accent-crit-bg:rgba(220,53,69,0.10);
  --proj-1:#3B6FD4;
  --proj-2:#9B5CD6;
  --proj-3:#1BA89A;
  --proj-4:#D65A85;
  --proj-5:#E08A2E;
  --proj-6:#5BA332;
  --bar-text:#FFFFFF;
  --glow-a:rgba(18,169,140,0.05);
  --glow-b:rgba(59,111,212,0.05);
  --daybg-weekend:rgba(28,36,48,0.045);
  --daybg-holiday:rgba(220,53,69,0.11);
  --daybg-makeup:rgba(18,169,140,0.12);
  --daybg-makeup-line:rgba(18,169,140,0.6);
  --dep-line:#6B7A96;
  --cp-line:#D98A00;
  --cp-glow:rgba(217,138,0,0.45);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 1200px 600px at 15% -10%, var(--glow-a), transparent 60%),
    radial-gradient(ellipse 900px 500px at 100% 0%, var(--glow-b), transparent 55%),
    var(--bg-base);
  color:var(--text-primary);
  font-family:var(--font-sans);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  transition:background-color .3s ease, color .3s ease;
}
::selection{background:rgba(62,214,181,0.3);}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ===== layout shell ===== */
#app{width:100%;margin:0 auto;padding:28px 40px 80px;}
@media (min-width:1900px){#app{padding-left:64px;padding-right:64px;}}
@media (max-width:720px){#app{padding:18px 14px 60px;}}

.topbar{
  display:flex;justify-content:space-between;align-items:flex-end;
  gap:16px;flex-wrap:wrap;
  padding-bottom:20px;border-bottom:1px solid var(--grid-line);
  margin-bottom:22px;
}
.eyebrow{
  font-family:var(--font-mono);font-size:11px;letter-spacing:0.22em;
  color:var(--accent-ok);text-transform:uppercase;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent-ok);
  box-shadow:0 0 8px var(--accent-ok);animation:pulse-dot 2.2s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:0.35;}}
.brand h1{font-size:26px;margin:6px 0 0;font-weight:900;letter-spacing:-0.01em;}
.topbar-actions{display:flex;gap:10px;flex-wrap:wrap;}

.btn{
  border:1px solid var(--grid-line-strong);background:var(--bg-raised);color:var(--text-primary);
  padding:10px 16px;border-radius:8px;font-size:13.5px;font-weight:600;
  transition:border-color .15s, transform .1s, background .15s;
}
.btn:hover{border-color:var(--accent-ok);background:var(--bg-raised-2);}
.btn:active{transform:scale(0.97);}
.btn.primary{background:var(--accent-ok);color:var(--bar-text);border-color:var(--accent-ok);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.danger{border-color:rgba(255,92,108,0.4);color:var(--accent-crit);background:transparent;}
.btn.danger:hover{background:var(--accent-crit-bg);border-color:var(--accent-crit);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-secondary);padding:6px 10px;}
.btn.ghost:hover{color:var(--text-primary);background:var(--bg-raised);}
.btn.small{padding:6px 11px;font-size:12.5px;}

/* ===== stats strip ===== */
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
@media (max-width:640px){.stats-strip{grid-template-columns:1fr;}}
.stat-card{
  background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:10px;
  padding:16px 18px;position:relative;overflow:hidden;
}
.stat-card::after{content:'';position:absolute;right:-30px;top:-30px;width:90px;height:90px;
  border-radius:50%;background:radial-gradient(circle, var(--stat-glow,rgba(62,214,181,.15)), transparent 70%);}
.stat-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.14em;color:var(--text-secondary);text-transform:uppercase;}
.stat-value{font-family:var(--font-mono);font-size:32px;font-weight:700;margin-top:6px;color:var(--text-primary);}
.stat-card.crit .stat-value{color:var(--accent-crit);}
.stat-card.crit{--stat-glow:rgba(255,92,108,.18);}
.stat-card.warn{--stat-glow:rgba(240,169,59,.18);}
.stat-card.clickable{cursor:pointer;transition:border-color .15s, transform .1s;user-select:none;}
.stat-card.clickable:hover{border-color:var(--grid-line-strong);}
.stat-card.clickable:active{transform:scale(0.995);}
.stat-card.clickable.open{border-color:var(--accent-ok);}
.stat-card.warn.clickable.open{border-color:var(--accent-warn);}
.stat-card.crit.clickable.open{border-color:var(--accent-crit);}
.stat-label{display:flex;align-items:center;gap:6px;}
.stat-chev{font-size:10px;color:var(--text-dim);transition:transform .18s;display:inline-block;}
.stat-chev.open{transform:rotate(180deg);color:var(--text-secondary);}

/* ===== stat detail panels ===== */
.stat-detail{background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:10px;padding:12px 16px;margin-bottom:12px;}
.sd-title{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:8px;}
.sd-row{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:7px;font-size:12.8px;cursor:pointer;transition:background .12s;}
.sd-row:hover{background:var(--bg-raised);}
.sd-name{font-weight:600;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sd-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sd-owner{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);flex:0 0 auto;}
.sd-meta{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex:0 0 auto;margin-left:auto;}
.sd-empty{font-size:12.5px;color:var(--text-dim);padding:6px 8px;}

/* ===== conflict panel ===== */
.conflict-panel{border-radius:10px;padding:14px 18px;margin-bottom:22px;border:1px solid var(--grid-line);}
.conflict-panel.clear{background:var(--bg-panel);color:var(--text-secondary);font-size:13.5px;
  display:flex;align-items:center;gap:8px;}
.conflict-panel.alert{background:var(--accent-crit-bg);border-color:rgba(255,92,108,0.5);}
.conflict-panel.alert .conflict-title{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:0.12em;color:var(--accent-crit);
  text-transform:uppercase;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.conflict-item{
  font-size:13.5px;padding:9px 0;border-top:1px dashed rgba(255,92,108,0.28);line-height:1.6;
}
.conflict-item:first-of-type{border-top:none;}
.conflict-item b{color:var(--text-primary);font-weight:600;}
.conflict-item .tag{
  display:inline-block;font-family:var(--font-mono);font-size:11px;padding:1px 6px;border-radius:4px;
  background:rgba(255,92,108,0.18);color:var(--accent-crit);margin-right:4px;
}

/* ===== tabs ===== */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid-line);margin-bottom:18px;}
.tab{
  background:transparent;border:none;color:var(--text-secondary);padding:10px 4px;margin-right:22px;
  font-size:13.5px;font-weight:600;font-family:var(--font-mono);letter-spacing:0.04em;
  border-bottom:2px solid transparent;position:relative;top:1px;
}
.tab:hover{color:var(--text-primary);}
.tab.active{color:var(--accent-ok);border-bottom-color:var(--accent-ok);}

/* ===== timeline ===== */
.panel-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.segmented{display:inline-flex;background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:8px;padding:3px;}
.segmented button{
  background:transparent;border:none;color:var(--text-secondary);padding:6px 13px;border-radius:6px;
  font-size:12.5px;font-weight:600;font-family:var(--font-mono);
}
.segmented button.active{background:var(--bg-raised-2);color:var(--accent-ok);}
.segmented.sm button{padding:5px 10px;font-size:11.5px;}
.filter-group{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filter-label{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);letter-spacing:0.08em;}
.proj-hidden-note{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);}
.proj-status-badge{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;vertical-align:middle;white-space:nowrap;}
.proj-status-badge.ps-not_started{background:rgba(139,150,170,0.18);color:var(--text-secondary);}
.proj-status-badge.ps-in_progress{background:rgba(62,214,181,0.16);color:var(--accent-ok);}
.proj-status-badge.ps-done{background:rgba(91,141,239,0.18);color:#8DB0FF;}
.proj-status-badge.ps-paused{background:rgba(240,169,59,0.18);color:var(--accent-warn);}
.proj-status-badge.ps-archived{background:rgba(139,150,170,0.14);color:var(--text-dim);}
/* ===== projects: list view ===== */
.pl-wrap{display:flex;flex-direction:column;gap:12px;}
.pl-block{background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:10px;overflow:hidden;}
.pl-block.proj-inactive{opacity:0.72;}
.pl-head{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;user-select:none;
  border-bottom:1px solid var(--grid-line);transition:background .12s;flex-wrap:wrap;}
.pl-head:hover{background:var(--bg-raised);}
.pl-caret{font-size:10px;color:var(--text-dim);transition:transform .18s;display:inline-block;transform:rotate(-90deg);}
.pl-caret.open{transform:rotate(0deg);}
.pl-name{font-size:14.5px;font-weight:700;}
.pl-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}
.pl-stats{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-left:auto;}
.pl-head-actions{display:flex;gap:4px;flex:0 0 auto;}
.pl-table-wrap{overflow-x:auto;}
.pl-table{width:100%;border-collapse:collapse;font-size:12.8px;}
.pl-table thead th{
  text-align:left;font-family:var(--font-mono);font-size:10.5px;font-weight:600;letter-spacing:0.06em;
  color:var(--text-secondary);text-transform:uppercase;padding:8px 10px;
  border-bottom:1px solid var(--grid-line);background:var(--bg-raised);white-space:nowrap;
}
/* WBS table: one column per level, parent cells merged across their children's rows */
.pl-table.wbs{table-layout:fixed;}
.pl-table.wbs th{width:25%;}
.pl-table.wbs td{
  padding:8px 10px;vertical-align:top;border:1px solid var(--grid-line);
  transition:background .1s;
}
.pl-table.wbs td.pl-cell{cursor:pointer;}
.pl-table.wbs td.pl-cell:hover{background:var(--bg-raised);}
.pl-table.wbs td.pl-cell.conflict{background:var(--accent-crit-bg);}
.pl-table.wbs td.pl-empty{background:transparent;border-color:transparent;}
/* tint by level so the nesting reads at a glance */
.pl-table.wbs td.lvl-1{background:rgba(91,141,239,0.07);}
.pl-table.wbs td.lvl-2{background:rgba(185,128,240,0.05);}
.pl-table.wbs td.lvl-3{background:rgba(79,209,197,0.04);}
.pl-table.wbs td.lvl-4{background:transparent;}
.pl-cell-top{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.pl-cell-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;}
.pl-title{font-weight:600;font-size:12.8px;}
.pl-warn{color:var(--accent-crit);font-size:11px;}
.pl-owner{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);white-space:nowrap;}
.pl-date{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);white-space:nowrap;}
.pl-deps{font-size:10.5px;color:var(--text-dim);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-dim{color:var(--text-dim);}
.pl-table.wbs .sub-add{opacity:0;margin-left:auto;}
.pl-table.wbs td.pl-cell:hover .sub-add{opacity:1;}

.proj-card.proj-inactive{opacity:0.72;}
.proj-card.proj-inactive .bar-top{filter:grayscale(0.6);}
.filter-select{
  background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:7px;color:var(--text-primary);
  padding:6px 10px;font-size:12.5px;font-family:var(--font-mono);
}
.filter-select:focus{outline:none;border-color:var(--accent-ok);}
.filter-summary{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);margin-bottom:10px;}
.ms-icon{margin-right:5px;flex:0 0 auto;font-size:11px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,0.3));}
.bar.is-milestone{box-shadow:0 1px 0 rgba(0,0,0,0.2) inset, 0 0 0 1px rgba(255,255,255,0.18) inset;}
.ms-toggle-field{margin-top:-4px;}
.ms-toggle.disabled{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px dashed var(--grid-line-strong);border-radius:9px;opacity:0.6;cursor:not-allowed;}
.ms-toggle.disabled .ms-check{background:var(--bg-panel);color:var(--text-dim);}
.tree-branch{color:var(--text-dim);font-size:11px;flex:0 0 auto;margin-right:-2px;}
.ms-row.lvl-2{background:linear-gradient(to right, var(--bg-raised) 0 2px, transparent 2px);}
.ms-row.lvl-3{background:linear-gradient(to right, var(--bg-raised) 0 2px, transparent 2px);}
.ms-row.lvl-4{background:linear-gradient(to right, var(--bg-raised) 0 2px, transparent 2px);}
.ms-row .ms-title{cursor:pointer;}
.sub-add{background:transparent;border:1px solid var(--grid-line-strong);color:var(--text-secondary);
  border-radius:6px;font-size:10.5px;padding:2px 7px;flex:0 0 auto;font-family:var(--font-mono);
  opacity:0;transition:opacity .12s, border-color .12s, color .12s;}
.ms-row:hover .sub-add{opacity:1;}
.sub-add:hover{border-color:var(--accent-ok);color:var(--accent-ok);}
.parent-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:14px;
  border:1px solid var(--accent-ok);border-radius:8px;background:var(--bg-raised-2);}
.parent-bar .pb-icon{color:var(--accent-ok);font-size:14px;flex:0 0 auto;}
.parent-bar .pb-info{flex:1;min-width:0;}
.parent-bar .pb-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.parent-bar .pb-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);margin-top:2px;}
.ms-toggle{display:flex;align-items:center;gap:11px;cursor:pointer;padding:10px 12px;border:1px solid var(--grid-line-strong);border-radius:9px;}
.ms-toggle:hover{background:var(--bg-raised);}
.ms-check{
  width:24px;height:24px;flex:0 0 auto;border-radius:6px;border:1px solid var(--grid-line-strong);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;
  background:var(--bg-raised);transition:all .12s;
}
.ms-check.on{background:var(--accent-ok);border-color:var(--accent-ok);color:var(--bar-text);}
.ms-toggle-txt{display:flex;flex-direction:column;}
.ms-toggle-txt .tt{font-size:13px;font-weight:600;}
.ms-toggle-txt .dd{font-size:11px;color:var(--text-secondary);margin-top:2px;}
.ms-tag{font-family:var(--font-mono);font-size:10px;color:var(--accent-ok);margin-left:4px;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cal-preset-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--grid-line);}
.cal-preset-row .filter-select{flex:1;}
.cal-dirty{color:var(--accent-warn);font-weight:600;margin-left:4px;}
.cal-title{font-size:15px;font-weight:700;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{margin-bottom:6px;}
.cal-dow{text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);padding:4px 0;}
.cal-dow.wkend{color:var(--accent-crit);}
.cal-cell{
  position:relative;aspect-ratio:1/1;border:1px solid var(--grid-line);border-radius:7px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;
  background:var(--bg-raised);transition:border-color .12s, background .12s;user-select:none;
}
.cal-cell:hover{border-color:var(--accent-ok);}
.cal-cell.empty{border:none;background:transparent;cursor:default;}
.cal-cell.weekend{background:var(--daybg-weekend);}
.cal-cell.holiday{background:var(--daybg-holiday);border-color:var(--accent-crit);}
.cal-cell.makeup{background:var(--daybg-makeup);border-color:var(--daybg-makeup-line);}
.cal-cell.today{outline:2px solid var(--accent-ok);outline-offset:1px;}
.cal-num{font-weight:600;}
.cal-badge{position:absolute;top:2px;right:3px;font-size:9px;font-family:var(--font-mono);padding:0 3px;border-radius:3px;line-height:1.4;}
.cal-badge.holiday{background:var(--accent-crit);color:#fff;}
.cal-badge.makeup{background:var(--accent-ok);color:var(--bar-text);}
.cal-legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 8px;font-size:12px;color:var(--text-secondary);}
.cal-legend span{display:flex;align-items:center;gap:6px;}
.cal-legend .lg{width:14px;height:14px;border-radius:4px;display:inline-block;}
.cal-legend .lg.holiday{background:var(--daybg-holiday);border:1px solid var(--accent-crit);}
.cal-legend .lg.makeup{background:var(--daybg-makeup);border:1px solid var(--daybg-makeup-line);}
.cal-legend .lg.weekend{background:var(--daybg-weekend);border:1px solid var(--grid-line-strong);}
.cal-hint{font-size:11.5px;color:var(--text-dim);line-height:1.6;margin-bottom:6px;}
.tpl-note{font-size:12px;color:var(--text-secondary);line-height:1.7;background:var(--bg-raised);border:1px solid var(--grid-line);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.tpl-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;max-height:52vh;overflow-y:auto;}
.tpl-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--grid-line-strong);border-radius:9px;background:var(--bg-raised);}
.tpl-item .tpl-info{flex:1;min-width:0;}
.tpl-item .tpl-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tpl-item .tpl-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:2px;}
.tpl-empty{text-align:center;color:var(--text-secondary);font-size:12.5px;padding:30px 10px;line-height:1.7;}
.tpl-frombar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;margin-bottom:14px;border:1px dashed var(--grid-line-strong);border-radius:8px;font-size:12.5px;color:var(--text-secondary);}
.tpl-selectedbar{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:14px;border:1px solid var(--accent-ok);border-radius:8px;background:var(--bg-raised-2);}
.tpl-selectedbar .tpl-sel-info{flex:1;min-width:0;}
.tpl-selectedbar .tpl-sel-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tpl-selectedbar .tpl-sel-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);margin-top:2px;}
.tpl-pick-hint{font-size:12px;color:var(--text-secondary);margin-bottom:12px;}
.exp-all{display:flex;align-items:center;gap:10px;padding:13px 14px;border:1px solid var(--accent-ok);border-radius:9px;background:var(--bg-raised-2);cursor:pointer;margin-bottom:6px;transition:filter .12s;}
.exp-all:hover{filter:brightness(1.08);}
.exp-divider{text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin:14px 0 10px;letter-spacing:0.06em;}
.exp-list{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow-y:auto;}
.exp-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--grid-line-strong);border-radius:9px;background:var(--bg-raised);cursor:pointer;transition:border-color .12s, background .12s;}
.exp-item:hover{border-color:var(--accent-ok);background:var(--bg-raised-2);}
.exp-info{flex:1;min-width:0;}
.exp-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.exp-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:2px;}
.exp-go{font-family:var(--font-mono);font-size:12px;color:var(--text-secondary);flex:0 0 auto;}
.exp-go.primary{color:var(--accent-ok);font-weight:600;}
.imp-intro{font-size:12px;color:var(--text-secondary);line-height:1.7;background:var(--bg-raised);border:1px solid var(--grid-line);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.imp-intro strong{color:var(--text-primary);}
.imp-drop{display:block;border:1.5px dashed var(--grid-line-strong);border-radius:10px;padding:26px 16px;text-align:center;cursor:pointer;transition:border-color .15s, background .15s;margin-bottom:14px;}
.imp-drop:hover{border-color:var(--accent-ok);background:var(--bg-raised);}
.imp-icon{font-size:24px;color:var(--accent-ok);margin-bottom:6px;}
.imp-txt{font-size:13px;color:var(--text-secondary);}
.imp-err{background:var(--accent-crit-bg);border:1px solid rgba(255,92,108,0.5);border-radius:8px;padding:12px 14px;margin-bottom:6px;}
.imp-err-title{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-crit);margin-bottom:8px;}
.imp-err-body{font-size:13px;color:var(--text-primary);line-height:1.6;}
.imp-err-list{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--text-primary);line-height:1.7;max-height:34vh;overflow-y:auto;}
.imp-err-list li{margin-bottom:3px;}
.imp-ok{background:rgba(62,214,181,0.1);border:1px solid var(--accent-ok);border-radius:8px;padding:12px 14px;margin-bottom:6px;}
.imp-ok-title{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent-ok);margin-bottom:8px;}
.imp-note{margin-top:10px;padding:8px 10px;border-radius:7px;background:rgba(240,169,59,0.12);
  border:1px solid rgba(240,169,59,0.4);color:var(--accent-warn);font-size:12px;line-height:1.7;}
.imp-ok-list{margin:0;padding-left:18px;font-size:13px;color:var(--text-primary);line-height:1.8;max-height:30vh;overflow-y:auto;}
.tpl-pick{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--grid-line-strong);border-radius:9px;background:var(--bg-raised);cursor:pointer;transition:border-color .12s, background .12s;}
.tpl-pick:hover{border-color:var(--accent-ok);}
.tpl-pick.sel{border-color:var(--accent-ok);background:var(--bg-raised-2);}
.tpl-pick .tpl-info{flex:1;min-width:0;}
.tpl-pick .tpl-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tpl-pick .tpl-sub{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:2px;}
.tpl-pick .tpl-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--grid-line-strong);flex:0 0 auto;position:relative;}
.tpl-pick.sel .tpl-radio{border-color:var(--accent-ok);}
.tpl-pick.sel .tpl-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent-ok);}

.timeline-table{
  background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:10px;
  overflow-x:auto;overflow-y:hidden;position:relative;
}
.timeline-table{cursor:grab;}
.timeline-table.dragging{cursor:grabbing;user-select:none;}
.timeline-table.dragging .bar{pointer-events:none;}
.btn.is-disabled{opacity:0.45;cursor:not-allowed;}
.btn.ghost.on{color:var(--accent-ok);border-color:var(--accent-ok);background:rgba(62,214,181,0.1);}
.btn.is-disabled:hover{border-color:var(--grid-line-strong);background:transparent;}
.dep-svg{position:absolute;top:0;z-index:2;pointer-events:none;overflow:visible;}
.dep-svg path{pointer-events:stroke;}
/* content-visibility lets the browser skip layout entirely for rows scrolled out of view.
   This is what keeps a many-project timeline responsive: all the bars stay in the DOM (so
   the dependency connectors are complete) but only the rows on screen are laid out.
   contain-intrinsic-size tells it what to reserve meanwhile; `auto` means it remembers the
   real size once a row has been rendered, so the scroll height converges exactly. */
/* width:max-content is load-bearing, not cosmetic. The row is a flex container holding the
   172px label plus a track that can be many thousands of pixels wide. Left to size itself
   it took the scroll container's width and let the track overflow, so the row's own box
   covered only the first screenful. Two things then broke once the timeline was scrolled
   past that point: the sticky label column had nothing left to stick within and slid away,
   and — because the row's box no longer intersected the viewport — content-visibility
   judged the whole row off-screen and skipped it, so every bar in it vanished while the
   dependency connectors (a full-width sibling) kept drawing into the empty space. */
.tl-row{display:flex;border-bottom:1px solid var(--grid-line);
  width:var(--row-w, max-content);min-width:100%;
  content-visibility:auto;contain-intrinsic-size:auto 38px;}
.tl-row.group-header{contain-intrinsic-size:auto 39px;}
/* the header row carries the month ticks and the today marker — always keep it rendered */
.tl-header-row{content-visibility:visible;}
.tl-row:last-child{border-bottom:none;}
.tl-label{
  position:sticky;left:0;z-index:3;width:172px;flex:0 0 172px;background:var(--bg-panel);
  padding:10px 14px;display:flex;align-items:center;gap:8px;border-right:1px solid var(--grid-line);
}
.tl-row.group-header .tl-label{background:var(--bg-raised);font-weight:700;font-size:13px;}
.swatch{width:9px;height:9px;border-radius:2px;flex:0 0 9px;}
.tl-label .cnt{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-left:auto;}
/* flex:0 0 auto so the track keeps the width it declares. As a default flex item it was
   shrunk to the container's width, which left the week grid lines and the group-header
   background covering only the first screenful of a scrolled timeline. */
.tl-track{position:relative;height:100%;flex:0 0 auto;
  background-image:linear-gradient(to right, var(--grid-line) 1px, transparent 1px);
  background-size:var(--week-w, 182px) 100%;background-position:0 0;}
.tl-row.group-header .tl-track{background:var(--bg-raised);}
.tl-header-row .tl-track{height:34px;background:transparent;}
.tl-header-row .tl-label{background:var(--bg-panel);}
.month-tick{position:absolute;top:0;height:100%;border-left:1px solid var(--grid-line-strong);
  padding-left:6px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);
  display:flex;align-items:center;white-space:nowrap;}
.today-tick{position:absolute;top:0;height:100%;display:flex;align-items:center;z-index:2;}
.today-tick .line{width:1px;height:100%;background:var(--accent-ok);opacity:0.55;}
.today-tick .label{position:absolute;top:2px;left:4px;font-family:var(--font-mono);font-size:9.5px;
  color:var(--accent-ok);background:rgba(62,214,181,0.12);padding:1px 5px;border-radius:3px;white-space:nowrap;}
/* One shared stripe layer for the whole timeline, sitting above the rows' own backgrounds
   but below the lanes (equal z-index, earlier in the DOM) and below the sticky label column. */
.sd-more{margin-top:8px;}
/* The project cards and owner panels are long vertical lists; letting the browser skip
   layout for the ones scrolled out of view is what keeps these tabs responsive once there
   are dozens of projects. Not applied to .tl-row: the dependency connectors measure bar
   offsets, which a skipped subtree does not report. */
.proj-card{content-visibility:auto;contain-intrinsic-size:auto 420px;}
.owner-panel{content-visibility:auto;contain-intrinsic-size:auto 320px;}
.pl-table-wrap{contain:layout style;}
.day-bg-layer{position:absolute;top:0;bottom:0;left:172px;z-index:1;pointer-events:none;}
.day-bg{position:absolute;top:0;height:100%;z-index:0;pointer-events:none;}
.day-bg.weekend{background:var(--daybg-weekend);}
.day-bg.holiday{background:var(--daybg-holiday);}
.day-bg.makeup{background:var(--daybg-makeup);border-bottom:2px solid var(--daybg-makeup-line);}

/* contain:layout isolates each lane, so repainting the bars inside one during a scroll
   does not force the whole timeline (every row, every track, the sticky labels) to be laid
   out again. The lane is already position:relative, so bars' offsetParent is unchanged and
   the dependency connectors measure the same geometry as before. */
.lane{position:relative;height:38px;z-index:1;contain:layout style;}
.bar{
  position:absolute;top:6px;height:26px;border-radius:6px;
  display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:var(--bar-text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:0 1px 0 rgba(0,0,0,0.2) inset;transition:filter .12s, transform .12s;
}
.bar:hover{filter:brightness(1.12);transform:translateY(-1px);}
.bar .dot{width:5px;height:5px;border-radius:50%;background:rgba(0,0,0,0.35);margin-right:6px;flex:0 0 5px;}
.bar.status-done{opacity:0.55;}
.bar.status-delayed{outline:2px dashed rgba(240,169,59,0.7);outline-offset:1px;}
.bar.conflict{
  outline:2px solid var(--accent-crit);outline-offset:1px;
  box-shadow:0 0 0 4px rgba(255,92,108,0.16);
}
.bar.conflict::after{content:'⚠';position:absolute;right:6px;font-size:11px;color:#3A0A0E;}
.bar.critical-path{outline:2px solid var(--cp-line);outline-offset:1px;box-shadow:0 0 0 4px var(--cp-glow);z-index:2;}
.bar.cp-dimmed{opacity:0.4;}
/* Zoomed out far enough that a bar is only a few pixels wide: labels and the conflict glyph
   would overflow into neighbouring bars, so the bar becomes a plain block. The tooltip still
   carries everything, and the row is still clickable. */
.tl-dense .bar{padding:0 2px;font-size:0;border-radius:3px;box-shadow:none;}
.tl-dense .bar .ms-icon,.tl-dense .bar .dot,.tl-dense .bar .dep-mark{display:none;}
.tl-dense .bar.conflict::after{content:none;}
.tl-dense .bar:hover{transform:none;}
.tl-zoom{display:flex;align-items:center;gap:6px;}
.tl-zoom .zoom-note{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);white-space:nowrap;}
.cp-summary-wrap{position:sticky;left:180px;display:inline-flex;z-index:1;}
.cp-summary{font-family:var(--font-mono);font-size:10.5px;color:var(--cp-line);background:var(--cp-glow);padding:2px 8px;border-radius:10px;white-space:nowrap;align-self:center;margin-top:6px;font-weight:600;}
.empty-lane-note{color:var(--text-dim);font-size:12px;font-family:var(--font-mono);padding-left:12px;
  display:flex;align-items:center;height:38px;}

/* ===== project / owner cards ===== */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.proj-card{background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:10px;overflow:hidden;}
.proj-card .bar-top{height:4px;}
.proj-card .head{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.proj-card .head h3{margin:0;font-size:15.5px;font-weight:700;}
.proj-card .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:4px;}
.proj-card .actions{display:flex;gap:2px;flex:0 0 auto;}
.ms-list{padding:0 10px 12px;}
.ms-row{
  display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:7px;font-size:12.8px;
}
.ms-row:hover{background:var(--bg-raised);}
.ms-row.conflict{background:var(--accent-crit-bg);}
.ms-row .ms-title{font-weight:600;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-row .ms-owner{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);flex:0 0 auto;}
.ms-row .ms-dates{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);flex:0 0 auto;}
.pill{font-family:var(--font-mono);font-size:10px;padding:2px 7px;border-radius:20px;flex:0 0 auto;font-weight:600;}
.pill.not_started{background:rgba(139,150,170,0.16);color:var(--text-secondary);}
.pill.in_progress{background:rgba(62,214,181,0.16);color:var(--accent-ok);}
.pill.done{background:rgba(91,141,239,0.16);color:#8DB0FF;}
.pill.delayed{background:rgba(240,169,59,0.16);color:var(--accent-warn);}
.card-foot{padding:8px 16px 14px;}
.empty-note{color:var(--text-dim);font-size:12.5px;padding:6px 16px 14px;font-family:var(--font-mono);}

.owner-panel{background:var(--bg-panel);border:1px solid var(--grid-line);border-radius:10px;margin-bottom:14px;overflow:hidden;}
.owner-panel .oh{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--grid-line);}
.owner-panel .oh h3{margin:0;font-size:14.5px;}
.owner-panel .oh .sub{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary);}
.empty-state .glyph{font-family:var(--font-mono);font-size:32px;color:var(--grid-line-strong);margin-bottom:10px;}
.empty-state p{margin:4px 0;font-size:13.5px;}

/* ===== modal ===== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(6,9,13,0.65);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  animation:fadein .12s ease-out;
}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.modal{
  background:var(--bg-panel);border:1px solid var(--grid-line-strong);border-radius:12px;
  width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.5);
}
.modal-head{padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:center;}
.modal-head h2{font-size:16px;margin:0;}
.modal-body{padding:6px 20px 20px;}
.field{margin-bottom:14px;}
.field label{display:block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.08em;
  color:var(--text-secondary);text-transform:uppercase;margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field select{
  width:100%;background:var(--bg-raised);border:1px solid var(--grid-line-strong);border-radius:7px;
  color:var(--text-primary);padding:9px 11px;font-size:13.5px;
}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent-ok);}
.field-hint{font-size:11px;color:var(--text-dim);margin-top:6px;line-height:1.5;}
.parent-derived-note{font-size:12px;line-height:1.6;color:var(--text-secondary);background:var(--bg-raised-2);border:1px solid var(--grid-line);border-left:3px solid var(--accent-warn);border-radius:6px;padding:10px 12px;margin-bottom:14px;}
.field input:disabled,.field select:disabled{opacity:.6;cursor:not-allowed;}
.field input.locked{opacity:0.6;cursor:not-allowed;background:var(--bg-panel);}
.deps-box{display:flex;flex-direction:column;gap:5px;max-height:150px;overflow-y:auto;border:1px solid var(--grid-line-strong);border-radius:8px;padding:6px;background:var(--bg-raised);}
.deps-empty{font-size:12px;color:var(--text-dim);padding:8px 6px;text-align:center;}
.dep-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12.5px;transition:background .1s;}
.dep-item:hover{background:var(--bg-raised-2);}
.dep-item.on{background:rgba(62,214,181,0.1);}
.dep-check{width:18px;height:18px;flex:0 0 auto;border:1px solid var(--grid-line-strong);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--accent-ok);font-weight:700;}
.dep-item.on .dep-check{border-color:var(--accent-ok);background:rgba(62,214,181,0.15);}
.dep-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dep-dates{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);flex:0 0 auto;}
.bar .dep-mark{margin-left:5px;font-size:10px;opacity:0.7;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.swatch-picker{display:flex;gap:8px;}
.swatch-btn{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;}
.swatch-btn.selected{border-color:var(--text-primary);transform:scale(1.08);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}
.field-error{color:var(--accent-crit);font-size:12px;margin-top:8px;display:none;}
.theme-opt{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--grid-line-strong);
  border-radius:9px;margin-bottom:10px;cursor:pointer;transition:border-color .15s, background .15s;
}
.theme-opt:hover{background:var(--bg-raised);}
.theme-opt.active{border-color:var(--accent-ok);background:var(--bg-raised-2);}
.theme-opt .glyph{font-size:20px;flex:0 0 auto;width:26px;text-align:center;}
.theme-opt .txt{flex:1;}
.theme-opt .txt .t{font-size:13.5px;font-weight:600;}
.theme-opt .txt .d{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
.theme-opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--grid-line-strong);flex:0 0 auto;position:relative;}
.theme-opt.active .radio{border-color:var(--accent-ok);}
.theme-opt.active .radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent-ok);}
.theme-sched{padding:2px 14px 10px 52px;margin-top:-4px;margin-bottom:10px;display:none;}
.theme-sched.show{display:block;}
.theme-sched .row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text-secondary);margin-bottom:8px;}
.theme-sched .row label{font-family:var(--font-mono);font-size:11px;min-width:64px;}
.theme-sched input[type=time]{
  background:var(--bg-raised);border:1px solid var(--grid-line-strong);border-radius:6px;
  color:var(--text-primary);padding:6px 9px;font-size:13px;font-family:var(--font-mono);
}

/* toast */
#toastRoot{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{
  background:var(--bg-raised-2);border:1px solid var(--grid-line-strong);color:var(--text-primary);
  padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,0.4);
  animation:toastin .15s ease-out;
}
.toast.err{border-color:rgba(255,92,108,0.5);color:var(--accent-crit);}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.loading-overlay{position:fixed;inset:0;background:var(--bg-base);display:flex;align-items:center;justify-content:center;z-index:100;}
.loading-overlay .lm{font-family:var(--font-mono);color:var(--accent-ok);font-size:13px;letter-spacing:0.1em;}

.footer-note{text-align:center;color:var(--text-dim);font-size:11.5px;font-family:var(--font-mono);margin-top:36px;}
.storage-banner{
  background:rgba(240,169,59,0.12);border:1px solid rgba(240,169,59,0.4);color:var(--accent-warn);
  border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:16px;
  display:flex;align-items:flex-start;gap:8px;
}
</style>
</head>
<body>
<div id="loadingOverlay" class="loading-overlay"><span class="lm">加载中…</span></div>
<div id="app" style="display:none;">
  <div id="storageBanner"></div>
  <header class="topbar">
    <div class="brand">
      <div class="eyebrow">Milestone Control</div>
      <h1>项目里程碑指挥台</h1>
    </div>
    <div class="topbar-actions">
      <button class="btn" id="btnTheme" title="主题设置">🌙 主题</button>
      <button class="btn" id="btnCalendar" title="日历设置">📅 日历</button>
      <button class="btn" id="btnTemplates" title="模板管理">📋 模板</button>
      <button class="btn" id="btnExportExcel" title="导出Excel">⬇ 导出Excel</button>
      <button class="btn" id="btnImportExcel" title="导入Excel">⬆ 导入Excel</button>
      <button class="btn" id="btnExport">导出备份</button>
      <label class="btn" id="btnImport" style="position:relative;overflow:hidden;">
        导入备份
        <input type="file" id="fImport" accept="application/json" style="position:absolute;inset:0;opacity:0;cursor:pointer;">
      </label>
      <button class="btn" id="btnReset">重置数据</button>
      <button class="btn" id="btnNewProject">＋ 新建项目</button>
      <button class="btn primary" id="btnNewMilestone">＋ 新建里程碑</button>
    </div>
  </header>

  <section class="stats-strip" id="statsStrip"></section>
  <section id="conflictPanel"></section>

  <nav class="tabs">
    <button class="tab active" data-tab="timeline">全局时间线</button>
    <button class="tab" data-tab="projects">项目列表</button>
    <button class="tab" data-tab="owners">责任人视图</button>
  </nav>

  <main id="tabContent"></main>

  <div class="footer-note">数据自动保存（需网页版/桌面版 + Pro 及以上订阅）· 手机端建议使用导出备份</div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

function pickDayWidth(totalDays){

  if(z && z !== "fit"){
    var n = parseFloat(z);
    if(isFinite(n) && n > 0) return n;

  for(var i = 0; i < DAY_W_STEPS.length; i++){

}

/* ---------- theme engine ---------- */
function parseHM(s){
  var m = /^(\d{1,2}):(\d{2})$/.exec(s || "");
  if(!m) return 0;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
// Given a schedule, is "now" within the daytime window?
function isDaytimeBySchedule(){
  var now = new Date();
  var cur = now.getHours()*60 + now.getMinutes();
  var day = parseHM(themeSettings.dayStart);
  var night = parseHM(themeSettings.nightStart);
  if(day === night) return true;
  if(day < night){
    // daytime is a normal interval [day, night)
    return cur >= day && cur < night;
  } else {
    // day starts after night (e.g. day 07:00 impossible here) — handle wrap
    return cur >= day || cur < night;
  }
}
// Resolve the effective concrete theme ("dark"|"light") from current settings.
function resolveEffectiveTheme(){
  var mode = themeSettings.mode;
  if(mode === "dark" || mode === "light") return mode;
  if(mode === "system"){
    if(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) return "light";
    return "dark";
  }
  if(mode === "schedule"){
    return isDaytimeBySchedule() ? "light" : "dark";
  }
  return "dark";
}
function applyTheme(){
  var eff = resolveEffectiveTheme();
  document.documentElement.setAttribute("data-theme", eff);
  var btn = document.getElementById("btnTheme");
  if(btn){
    var icon = eff === "light" ? "☀️" : "🌙";
    btn.textContent = icon + " 主题";
  }
}
// Wire up (or tear down) the listeners/timers a given mode needs.
function refreshThemeWatchers(){
  // system listener
  if(window.matchMedia){
    if(!systemThemeMQ){
      systemThemeMQ = window.matchMedia("(prefers-color-scheme: light)");
      var handler = function(){ if(themeSettings.mode === "system") applyTheme(); };
      if(systemThemeMQ.addEventListener) systemThemeMQ.addEventListener("change", handler);
      else if(systemThemeMQ.addListener) systemThemeMQ.addListener(handler);
    }
  }
  // schedule timer
  if(scheduleTimer){ clearInterval(scheduleTimer); scheduleTimer = null; }
  if(themeSettings.mode === "schedule"){
    scheduleTimer = setInterval(function(){ applyTheme(); }, 30000); // re-check every 30s
  }
}
async function loadThemeSettings(){
  if(!storagePresent()) return;
  try{
    var res = await readSavedDoc(THEME_KEY);
    if(res.value){
      var parsed = JSON.parse(res.value);

        if(parsed.nightStart) themeSettings.nightStart = parsed.nightStart;
      }
    }
  } catch(e){
    console.warn("load theme failed", e);
  }
}
async function persistThemeSettings(){

// Weekend by default = Sat/Sun. Marks override: "holiday" forces off, "workday" forces on.
function isWeekendDate(iso){
  var d = toDate(iso);
  var wd = d.getDay(); // 0 Sun ... 6 Sat
  return wd === 0 || wd === 6;
}
// Returns "work" | "off" for a given date, considering marks.
// Memoized: this sits inside day-by-day loops (countWorkdays, endFromWorkdays, the CPM
// backward pass) and each miss otherwise builds a Date object to find the weekday.
var _dayKindCache = Object.create(null);
var _workdaysCache = Object.create(null);
// Called whenever calendarMarks is replaced — the caches encode those marks.
function invalidateCalendarCaches(){
  _dayKindCache = Object.create(null);
  _workdaysCache = Object.create(null);
  dataVersion++;
}
function dayKind(iso){
  var hit = _dayKindCache[iso];
  if(hit !== undefined) return hit;
  var mark = calendarMarks[iso];
  var r = (mark === "holiday") ? "off"          // 放假
        : (mark === "workday") ? "work"         // 调休上班
        : (isWeekendDate(iso) ? "off" : "work");
  _dayKindCache[iso] = r;
  return r;
}
// Visual class for a date cell/column: normal-weekend, holiday, makeup.
function dayVisual(iso, marksSrc){
  var src = marksSrc || calendarMarks;
  var mark = src[iso];
  if(mark === "holiday") return "holiday";
  if(mark === "workday") return "makeup";
  if(isWeekendDate(iso)) return "weekend";
  return "workday";
}
// Count working days in [startISO, endISO] inclusive (each end counted), per dayKind.
function countWorkdays(startISO, endISO){
  if(endISO < startISO) return 0;
  var key = startISO + "|" + endISO;
  var hit = _workdaysCache[key];
  if(hit !== undefined) return hit;
  var n = 0;
  var cur = startISO;
  var guard = 0;
  while(cur <= endISO && guard < 4000){
    if(dayKind(cur) === "work") n++;
    cur = addDays(cur, 1);
    guard++;
  }
  _workdaysCache[key] = n;
  return n;
}
// Given a start date and a workday count (>=1), return the end date so that
// [start, end] contains exactly `hours` working days. If start itself is a
// non-working day, we still begin counting from the first working day at/after start.
function endFromWorkdays(startISO, hours){
  hours = Math.max(1, Math.round(hours));
  var cur = startISO;
  var counted = 0;
  var last = startISO;
  var guard = 0;
  // Ensure we land the end on a working day; count working days until we reach `hours`.
  while(counted < hours && guard < 4000){
    if(dayKind(cur) === "work"){ counted++; last = cur; }
    if(counted >= hours) break;
    cur = addDays(cur, 1);
    guard++;
  }
  return last;
}
async function loadCalendar(){
  if(!storagePresent()) return;
  try{
    var res = await readSavedDoc(CAL_KEY);
    if(res.value){
      var parsed = JSON.parse(res.value);
      if(parsed && typeof parsed === "object"){ calendarMarks = parsed.marks || parsed || {}; invalidateCalendarCaches(); }
    }
  } catch(e){
    console.warn("load calendar failed", e);
  }
}
async function persistCalendar(){
  if(!storagePresent()) return;
  try{
    await window.storage.set(CAL_KEY, JSON.stringify({ marks: calendarMarks }), false);
    invalidateKeyList();   // a new key may now exist
  } catch(e){
    console.warn("save calendar failed", e);
  }
}

// Build a template object from an existing project (strips dates + owner).
function buildTemplateFromProject(projectId, tplName){
  var p = getProject(projectId);
  // Walk in tree order so levels are preserved for re-creation.
  var tasks = projectTaskTree(projectId).map(function(node){
    var m = node.task;
    var depTitles = (m.deps || []).map(function(id){ var d=getTask(id); return d?d.title:""; }).filter(Boolean);
    return { title: m.title, isMilestone: !!m.isMilestone, workdays: m.workdays || 1, status: m.status || "not_started", depTitles: depTitles, level: node.level };
  });
  return {
    id: uid(),
    name: tplName || (p ? p.name : "未命名模板"),
    projMeta: p ? { name: p.name, client: p.client || "", platform: p.platform || "", color: p.color } : { name: "", client: "", platform: "", color: PROJ_COLORS[0] },
    tasks: tasks
  };
}
// Instantiate a new project + tasks from a template. Dates and owner left blank.
function createProjectFromTemplate(tpl, overrideName){
  var color = (tpl.projMeta && tpl.projMeta.color) || PROJ_COLORS[state.projects.length % PROJ_COLORS.length];
  var newProj = {
    id: uid(),
    name: overrideName || (tpl.projMeta ? tpl.projMeta.name : tpl.name) || "新项目",
    client: tpl.projMeta ? (tpl.projMeta.client || "") : "",
    platform: tpl.projMeta ? (tpl.projMeta.platform || "") : "",
    color: color,
    status: "not_started"
  };
  state.projects.push(newProj);
  var titleToId = {};
  var created = [];
  var lastIdAtLevel = {};
  (tpl.tasks || []).forEach(function(tk){
    var lv = tk.level || 1;
    var parentId = (lv > 1) ? (lastIdAtLevel[lv - 1] || null) : null;
    var nt = {
      id: uid(), projectId: newProj.id,
      title: tk.title || "未命名任务",
      owner: "",                 // left blank
      start: "", end: "",        // left blank
      status: tk.status || "not_started",
      isMilestone: !parentId,
      workdays: tk.workdays || 1,
      deps: [],
      parentId: parentId
    };
    state.milestones.push(nt);
    lastIdAtLevel[lv] = nt.id;
    for(var d = lv + 1; d <= MAX_TASK_DEPTH; d++){ lastIdAtLevel[d] = null; }
    created.push({ node: nt, depTitles: tk.depTitles || [] });
    if(!(nt.title in titleToId)){ titleToId[nt.title] = nt.id; }
  });
  // wire deps by title (dates blank so no auto-scheduling triggers yet)
  created.forEach(function(c){
    c.node.deps = c.depTitles.map(function(dt){ return titleToId[dt]; }).filter(Boolean);
  });
  return newProj;
}

/* ---------- Excel export ---------- */
// Column order used by the exported sheet.
// 层级 and 类型 are intentionally omitted: the level column holding the title encodes the
// level, and the type follows from it (L1 = 里程碑, deeper = 普通任务). Both are derived on import.
var EXPORT_HEADERS = ["项目","客户","硬件平台","项目状态","一级任务","二级任务","三级任务","四级任务","责任人","开始日期","结束日期","工时(工作日)","状态"];
// Dependencies live on their own sheet, one row per 任务 → 前置任务 pair. Keeping them out
// of the schedule sheet is what lets a parent task own a dependency even though it has no
// schedule row of its own.
var DEP_SHEET_NAME = "依赖关系";
var DEP_HEADERS = ["项目","任务","前置任务"];

// Build export rows plus the merge ranges that express containment.
//
// Only leaf tasks get a schedule row. A task that has children carries no schedule of its
// own (its dates, workdays and status are derived from the subtree, its owner is discarded),
// so a row for it would just repeat derived data. Its name instead lives in a merged cell
// spanning the rows of the leaves beneath it — the hierarchy still reads top-to-bottom.
//
// Dependencies are not in this sheet at all — they go to the 依赖关系 sheet, keyed by task
// title, so a parent keeps its own dependencies instead of having them pushed onto a child.
//
// Merges:
//  - project columns merge across all of that project's rows (no repetition per row)
//  - each parent's name cell merges down over the leaf rows in its subtree
function taskRowsForExport(projectId){
  var projects = state.projects.filter(function(p){ return projectId ? p.id === projectId : true; });
  projects = projects.slice().sort(function(a,b){ return a.name < b.name ? -1 : (a.name > b.name ? 1 : 0); });

  var rows = [];
  var depRows = [];          // rows of the 依赖关系 sheet
  var merges = [];           // {s:{r,c}, e:{r,c}} — 0-based, row 0 is the header
  var LEVEL_COL_BASE = EXPORT_HEADERS.indexOf("一级任务");

  projects.forEach(function(p){
    var tree = projectTaskTree(p.id);
    if(tree.length === 0) return;
    var projFirstRow = rows.length + 1;   // +1 for the header row
    var LEVEL_NAMES = ["一级任务","二级任务","三级任务","四级任务"];
    var depTitlesOf = function(t){
      return (t.deps && t.deps.length)
        ? t.deps.map(function(id){ var d = getTask(id); return d ? d.title : ""; }).filter(Boolean)
        : [];
    };

    // Leaves (tasks with no children) are the only ones that get a schedule row.
    // Walk the flat tree once, assigning a row index to each leaf in order.
    var isLeaf = tree.map(function(node){ return childrenOf(node.task.id).length === 0; });
    var leafRow = [];                      // tree index -> row index, or -1
    var nextRow = rows.length + 1;
    tree.forEach(function(node, i){ leafRow[i] = isLeaf[i] ? nextRow++ : -1; });

    // Every task's dependencies go to the 依赖关係 sheet, parents included, in tree order.
    tree.forEach(function(node){
      depTitlesOf(node.task).forEach(function(dt){
        depRows.push({ "项目": p.name || "", "任务": node.task.title || "", "前置任务": dt });
      });
    });

    tree.forEach(function(node, i){
      if(!isLeaf[i]) return;
      var m = node.task, lvl = Math.min(node.level, MAX_TASK_DEPTH);
      var row = {
        "项目": p.name || "",
        "客户": p.client || "",
        "硬件平台": p.platform || "",
        "项目状态": PROJ_STATUS_LABEL[projStatus(p)] || "",
        "一级任务": "", "二级任务": "", "三级任务": "", "四级任务": "",
        "责任人": m.owner || "",
        "开始日期": m.start || "",
        "结束日期": m.end || "",
        "工时(工作日)": (typeof m.workdays === "number" ? m.workdays : (m.start && m.end ? countWorkdays(m.start, m.end) : "")),
        "状态": STATUS_LABEL[m.status] || m.status || ""
      };
      row[LEVEL_NAMES[lvl - 1]] = m.title || "";
      rows.push(row);
    });

    // A parent's name goes in its level column on the first leaf row beneath it,
    // merged down to the last leaf row of its subtree.
    tree.forEach(function(node, i){
      if(isLeaf[i]) return;
      var first = -1, last = -1;
      for(var j = i + 1; j < tree.length && tree[j].level > node.level; j++){
        if(leafRow[j] === -1) continue;
        if(first === -1) first = leafRow[j];
        last = leafRow[j];
      }
      if(first === -1) return;             // subtree yielded no rows
      var col = LEVEL_COL_BASE + Math.min(node.level, MAX_TASK_DEPTH) - 1;
      rows[first - 1][LEVEL_NAMES[Math.min(node.level, MAX_TASK_DEPTH) - 1]] = node.task.title || "";
      if(last > first){
        merges.push({ s:{ r:first, c:col }, e:{ r:last, c:col } });
      }
    });

    // merge the project-level columns across this project's whole block
    var projLastRow = rows.length;        // last row index (header offset already applied)
    if(projLastRow > projFirstRow){
      [0,1,2,3].forEach(function(c){
        merges.push({ s:{ r:projFirstRow, c:c }, e:{ r:projLastRow, c:c } });
      });
    }
  });

  return { rows: rows, merges: merges, depRows: depRows };
}
function exportToExcel(projectId){
  if(typeof XLSX === "undefined"){
    showToast("Excel 组件未加载，请刷新后重试", true);
    return;
  }
  var built = taskRowsForExport(projectId);
  var rows = built.rows;
  if(rows.length === 0){
    showToast("没有可导出的任务", true);
    return;
  }
  var headers = EXPORT_HEADERS;
  var ws = XLSX.utils.json_to_sheet(rows, { header: headers });
  // Merged cells express containment: project block + parent-over-children.
  ws["!merges"] = built.merges;
  // Column widths for readability.
  ws["!cols"] = [
    {wch:20},{wch:14},{wch:12},{wch:10},
    {wch:22},{wch:22},{wch:22},{wch:22},
    {wch:12},{wch:12},{wch:12},{wch:12},{wch:10}
  ];
  // Vertically centre merged cells so the parent name sits beside its children.
  Object.keys(ws).forEach(function(addr){
    if(addr[0] === "!") return;
    var cell = ws[addr];
    cell.s = cell.s || {};
    cell.s.alignment = { vertical: "center", wrapText: false };
  });
  var wb = XLSX.utils.book_new();
  var sheetName = projectId ? (getProject(projectId) || {}).name || "项目" : "全部项目";
  // Excel sheet names <=31 chars, no special chars.
  sheetName = String(sheetName).replace(/[\\\/\?\*\[\]:]/g, "_").slice(0, 31);
  XLSX.utils.book_append_sheet(wb, ws, sheetName || "Sheet1");

  // Second sheet: dependencies, one row per 任务 → 前置任务 pair. Always written, even when
  // empty, so the sheet itself documents the format for anyone filling it in by hand.
  var depAoa = [DEP_HEADERS.slice()];
  built.depRows.forEach(function(d){ depAoa.push(DEP_HEADERS.map(function(h){ return d[h]; })); });
  var depWs = XLSX.utils.aoa_to_sheet(depAoa);
  depWs["!cols"] = [{wch:20},{wch:28},{wch:28}];
  Object.keys(depWs).forEach(function(addr){
    if(addr[0] === "!") return;
    depWs[addr].s = { alignment: { vertical: "center", wrapText: false } };
  });
  XLSX.utils.book_append_sheet(wb, depWs, DEP_SHEET_NAME);

  var fnameBase = projectId ? ((getProject(projectId) || {}).name || "项目") : "全部项目";
  var fname = "项目里程碑_" + fnameBase.replace(/[\\\/\?\*\[\]:]/g, "_") + "_" + todayISO() + ".xlsx";
  try{
    XLSX.writeFile(wb, fname);
    showToast("Excel 已导出");
  }catch(e){
    console.error("excel export failed", e);
    showToast("导出失败，请重试", true);
  }
}

/* ---------- Excel import ---------- */
var STATUS_FROM_LABEL = { "未开始":"not_started", "进行中":"in_progress", "已完成":"done", "延期":"delayed" };
var EXPECTED_HEADERS = ["项目","客户","硬件平台","一级任务","二级任务","三级任务","四级任务","责任人","开始日期","结束日期","工时(工作日)","状态"];
var LEVEL_COLS = ["一级任务","二级任务","三级任务","四级任务"];

function normalizeDateCell(v){
  if(v === null || v === undefined || v === "") return "";
  // Already ISO-ish string
  if(typeof v === "string"){
    var s = v.trim();
    if(s === "") return "";
    var m = /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/.exec(s);
    if(m){ return m[1] + "-" + pad(+m[2]) + "-" + pad(+m[3]); }
    return null; // unrecognized
  }
  // Date object (SheetJS with cellDates)
  if(v instanceof Date && !isNaN(v)){ return isoOf(v); }
  // Excel serial number
  if(typeof v === "number" && isFinite(v)){
    var epoch = new Date(Date.UTC(1899,11,30));
    var d = new Date(epoch.getTime() + Math.round(v) * 86400000);
    return isoOf(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  return null;
}

/* Turn a 前置任务 cell into task titles.

   This cannot be a plain split. Real task titles contain commas of their own —
   「算法信号输出适配(状态，报警，控车)」 is a standard one — and splitting on every comma
   shredded those titles into fragments that matched nothing, so the dependency was reported
   as non-existent. But a cell may also genuinely list several predecessors.

   So the cell is matched against the titles the project actually has, never guessed at:
   the whole cell first, then the longest run of fragments that forms a known title, and so
   on across the rest of the cell. A title containing commas therefore matches as itself,
   while a real list still separates — and anything left over is reported by name.

   titleSet: an object whose keys are the project's task titles. */
function resolveDepCell(cell, titleSet){
  var s = String(cell == null ? "" : cell).trim();
  if(!s) return { deps: [], unresolved: [] };
  if(titleSet[s]) return { deps: [s], unresolved: [] };          // the common case

  // Split keeping the separators, so fragments can be re-joined exactly as written.
  var parts = s.split(/([；;,，])/);                              // [frag, sep, frag, sep, …]
  var deps = [], unresolved = [];
  var a = 0;
  while(a < parts.length){
    var matched = false;
    // longest candidate first, so a title that contains a separator wins over its fragments
    for(var b = parts.length - 1; b >= a; b -= 2){
      var cand = parts.slice(a, b + 1).join("").trim();
      if(cand && titleSet[cand]){
        deps.push(cand);
        a = b + 2;
        matched = true;
        break;
      }
    }
    if(!matched){
      var frag = (parts[a] || "").trim();
      if(frag) unresolved.push(frag);
      a += 2;
    }
  }
  return { deps: deps, unresolved: unresolved };
}

// Parse the 依赖关系 sheet, if the workbook has one.
// Returns { pairs:[{proj,task,dep,_row}], error }. A missing sheet is not an error:
// older files carried dependencies in a 前置任务 column on the schedule sheet instead.
function parseDepSheet(wb){
  var name = wb.SheetNames.filter(function(n){
    return String(n).trim() === DEP_SHEET_NAME;
  })[0];
  if(!name) return { pairs: [] };
  var ws = wb.Sheets[name];
  if(!ws) return { pairs: [] };
  var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
  if(!aoa || aoa.length === 0) return { pairs: [] };
  var header = aoa[0].map(function(h){ return String(h == null ? "" : h).trim(); });
  var missing = DEP_HEADERS.filter(function(h){ return header.indexOf(h) === -1; });
  if(missing.length){
    return { error: "「" + DEP_SHEET_NAME + "」表头缺少必需列：" + missing.join("、") +
                    "（应为 " + DEP_HEADERS.join(" | ") + "）" };
  }
  var ci = {};
  DEP_HEADERS.forEach(function(h){ ci[h] = header.indexOf(h); });
  var pairs = [];
  var carriedProj = "", carriedTask = "";
  for(var r = 1; r < aoa.length; r++){
    var raw = aoa[r];
    var proj = String(raw[ci["项目"]] == null ? "" : raw[ci["项目"]]).trim();
    var task = String(raw[ci["任务"]] == null ? "" : raw[ci["任务"]]).trim();
    var depCell = String(raw[ci["前置任务"]] == null ? "" : raw[ci["前置任务"]]).trim();
    // tolerate merged/blank repeats of 项目 and 任务 when filled in by hand
    if(proj) carriedProj = proj; else proj = carriedProj;
    if(task) carriedTask = task; else task = carriedTask;
    if(!depCell) continue;                      // blank 前置任务 -> nothing to declare
    // kept whole: splitting happens in validation, against the project's real task titles
    pairs.push({ proj: proj, task: task, depRaw: depCell, _row: r + 1 });
  }
  return { pairs: pairs };
}

// Parse workbook -> {rows:[{...raw}], depPairs:[...], error}. Schedule data comes from the
// first sheet; dependencies from the 依赖关系 sheet when present.
function parseImportWorkbook(wb){
  var sheetName = wb.SheetNames.filter(function(n){
    return String(n).trim() !== DEP_SHEET_NAME;
  })[0] || wb.SheetNames[0];
  var ws = wb.Sheets[sheetName];
  if(!ws) return { error: "文件中找不到工作表" };
  var aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true });
  if(!aoa || aoa.length === 0) return { error: "工作表为空" };
  var header = aoa[0].map(function(h){ return String(h == null ? "" : h).trim(); });
  // header check: every expected column must be present
  var missing = EXPECTED_HEADERS.filter(function(h){ return header.indexOf(h) === -1; });
  if(missing.length){ return { error: "表头缺少必需列：" + missing.join("、") + "。请使用本工具导出的 Excel 作为模板。" }; }
  var colIdx = {};
  EXPECTED_HEADERS.forEach(function(h){ colIdx[h] = header.indexOf(h); });
  var hasDepCol = header.indexOf("前置任务") !== -1;
  var depColIdx = header.indexOf("前置任务");
  var psColIdx = header.indexOf("项目状态");   // optional
  var rows = [];
  // Merged cells (project block, parent-over-children) leave the continuation rows blank.
  // Carry these forward so a file exported with merges re-imports cleanly.
  var FILL_COLS = ["项目","客户","硬件平台","项目状态"];
  var carried = {};
  for(var r=1; r<aoa.length; r++){
    var raw = aoa[r];
    // A row counts as empty only if it has no task title in any level column.
    var noTask = LEVEL_COLS.every(function(h){
      var ci = colIdx[h];
      return ci === -1 || String(raw[ci] == null ? "" : raw[ci]).trim() === "";
    });
    if(noTask) continue;
    var obj = { _row: r + 1 };
    EXPECTED_HEADERS.forEach(function(h){ obj[h] = raw[colIdx[h]]; });
    obj["前置任务"] = hasDepCol ? raw[depColIdx] : "";
    obj["项目状态"] = psColIdx !== -1 ? raw[psColIdx] : "";
    FILL_COLS.forEach(function(h){
      var v = String(obj[h] == null ? "" : obj[h]).trim();
      if(v){ carried[h] = v; }
      else if(carried[h]){ obj[h] = carried[h]; }
    });
    rows.push(obj);
  }
  if(rows.length === 0) return { error: "没有可导入的数据行" };
  var deps = parseDepSheet(wb);
  if(deps.error) return { error: deps.error };
  return { rows: rows, depPairs: deps.pairs, hasDepSheet: deps.pairs.length > 0 };
}

// Validate parsed rows against rules + existing projects. Returns {errors:[], groups:{projName:[tasks]}}
function validateImportRows(rows, depPairs){
  var errors = [];
  var groups = {};
  var projStatusByName = {};   // project name -> status key (from optional 项目状态 column)
  var projNameSet = {};
  state.projects.forEach(function(p){ projNameSet[p.name] = p; });

  // Running ancestor path per project, so a "flattened WBS" file (every row repeats
  // the full L1/L2/L3 path, or a merged file whose cells were filled in) still works:
  // the deepest filled column is this row's task, shallower ones are ancestor context.
  var pathByProj = {};
  var autoParents = 0;
  var roundedWorkdays = 0;

  rows.forEach(function(row){
    var rn = row._row;
    var projName = String(row["项目"] == null ? "" : row["项目"]).trim();
    // Determine level + title from the four level columns.
    var filled = [];
    LEVEL_COLS.forEach(function(col, i){
      var v = String(row[col] == null ? "" : row[col]).trim();
      if(v){ filled.push({ level: i + 1, title: v }); }
    });
    var level = 1, title = "";
    if(filled.length === 0){
      errors.push("第 " + rn + " 行：一级~四级任务列全部为空，至少需填写一个");
    } else {
      // deepest filled column is the task this row describes
      var deepest = filled[filled.length - 1];
      level = deepest.level; title = deepest.title;

      // Emit any named ancestor that hasn't appeared as a row of its own yet.
      if(projName){
        var path = pathByProj[projName] = pathByProj[projName] || {};
        filled.slice(0, -1).forEach(function(anc){
          if(path[anc.level] !== anc.title){
            path[anc.level] = anc.title;
            for(var d = anc.level + 1; d <= MAX_TASK_DEPTH; d++){ delete path[d]; }
            (groups[projName] = groups[projName] || []).push({
              _row: rn, title: anc.title, owner: "", start: "", end: "",
              status: "not_started", isMilestone: (anc.level === 1),
              workdays: 1, depTitles: [], level: anc.level
            });
            autoParents++;
          }
        });
        path[level] = title;
        for(var dd = level + 1; dd <= MAX_TASK_DEPTH; dd++){ delete path[dd]; }
      }
    }
    var typeLabel = String(row["类型"] == null ? "" : row["类型"]).trim();
    var owner = String(row["责任人"] == null ? "" : row["责任人"]).trim();
    var statusLabel = String(row["状态"] == null ? "" : row["状态"]).trim();
    var startRaw = row["开始日期"], endRaw = row["结束日期"];
    var workRaw = row["工时(工作日)"];

    if(!projName){ errors.push("第 " + rn + " 行：项目名称为空"); return; }
    if(!projNameSet[projName]){ errors.push("第 " + rn + " 行：找不到同名项目「" + projName + "」（导入只更新已存在的同名项目，不会新建）"); }

    // type — only top-level (level 1) tasks may be milestones
    // Type is derived from level: L1 is always a milestone, deeper levels never are.
    // A 类型 column may still be present in older files; flag it only if it contradicts.
    var isMilestone = (level === 1);
    if(typeLabel === "里程碑" && level !== 1){
      errors.push("第 " + rn + " 行：仅一级任务是里程碑（当前为第 " + level + " 级）");
    }
    if(typeLabel && typeLabel !== "里程碑" && typeLabel !== "普通任务"){
      errors.push("第 " + rn + " 行：类型「" + typeLabel + "」无效（应为 里程碑 或 普通任务）");
    }

    // status
    var status = "not_started";
    if(statusLabel === ""){ status = "not_started"; }
    else if(STATUS_FROM_LABEL[statusLabel]){ status = STATUS_FROM_LABEL[statusLabel]; }
    else { errors.push("第 " + rn + " 行：状态「" + statusLabel + "」无效（应为 未开始/进行中/已完成/延期）"); }

    // dates
    var start = normalizeDateCell(startRaw);
    var end = normalizeDateCell(endRaw);
    if(start === null){ errors.push("第 " + rn + " 行：开始日期格式无效（应为 YYYY-MM-DD）"); start = ""; }
    if(end === null){ errors.push("第 " + rn + " 行：结束日期格式无效（应为 YYYY-MM-DD）"); end = ""; }
    // both-or-neither for scheduling
    if((start && !end) || (!start && end)){
      errors.push("第 " + rn + " 行：开始/结束日期必须同时填写或同时留空");
    }
    if(start && end && end < start){
      errors.push("第 " + rn + " 行：结束日期早于开始日期");
    }

    // workdays
    var workdays;
    var ws = String(workRaw == null ? "" : workRaw).trim();
    if(ws === ""){
      workdays = (start && end) ? countWorkdays(start, end) : 1;
    } else {
      var wn = Number(ws);
      if(!isFinite(wn) || wn < 0){
        errors.push("第 " + rn + " 行：工时「" + ws + "」无效（应为数字）");
        workdays = 1;
      } else if(wn < 1 || Math.floor(wn) !== wn){
        // Half-days and 0 are common in real plans; the scheduler works in whole
        // working days, so round up to the nearest one and report it afterwards.
        workdays = Math.max(1, Math.ceil(wn));
        roundedWorkdays++;
      } else { workdays = wn; }
    }

    // Resolved in validation, where the project's task titles are known — see resolveDepCell.
    var depRaw = String(row["前置任务"] == null ? "" : row["前置任务"]).trim();

    // Optional 项目状态 column: validate, remember per project (first non-empty wins).
    var psLabel = String(row["项目状态"] == null ? "" : row["项目状态"]).trim();
    if(psLabel){
      var psKey = null;
      Object.keys(PROJ_STATUS_LABEL).forEach(function(k){
        if(PROJ_STATUS_LABEL[k] === psLabel){ psKey = k; }
      });
      if(!psKey){
        errors.push("第 " + rn + " 行：项目状态「" + psLabel + "」无效（应为 " +
          Object.keys(PROJ_STATUS_LABEL).map(function(k){ return PROJ_STATUS_LABEL[k]; }).join(" / ") + "）");
      } else if(!(projName in projStatusByName)){
        projStatusByName[projName] = psKey;
      }
    }

    (groups[projName] = groups[projName] || []).push({
      _row: rn,
      title: title, owner: owner, start: start || "", end: end || "",
      status: status, isMilestone: isMilestone, workdays: workdays,
      depTitles: [], depRaw: depRaw, level: level
    });
  });

  // Every task title in each project — the vocabulary a 前置任务 cell is resolved against.
  var titleSetByProj = {};
  Object.keys(groups).forEach(function(pn){
    var set = Object.create(null);
    groups[pn].forEach(function(t){ set[t.title] = true; });
    titleSetByProj[pn] = set;
  });

  // Resolve the 前置任务 column carried on the schedule rows themselves (older files).
  Object.keys(groups).forEach(function(pn){
    var set = titleSetByProj[pn];
    groups[pn].forEach(function(tk){
      if(!tk.depRaw) return;
      var res = resolveDepCell(tk.depRaw, set);
      tk.depTitles = res.deps;
      res.unresolved.forEach(function(u){
        errors.push("第 " + tk._row + " 行：前置任务「" + u + "」在同项目内不存在");
      });
    });
  });

  // Attach dependencies declared on the 依赖关系 sheet. Matching is by task title within the
  // project, so a parent task picks up its own dependency even though it has no schedule row.
  var depSheetCount = 0;
  (depPairs || []).forEach(function(dp){
    var where = "「" + DEP_SHEET_NAME + "」第 " + dp._row + " 行：";
    if(!dp.proj){ errors.push(where + "项目名称为空"); return; }
    if(!dp.task){ errors.push(where + "任务名称为空"); return; }
    var tasks = groups[dp.proj];
    if(!tasks){ errors.push(where + "项目「" + dp.proj + "」在计划表中不存在"); return; }
    var hits = tasks.filter(function(t){ return t.title === dp.task; });
    if(hits.length === 0){ errors.push(where + "任务「" + dp.task + "」在项目「" + dp.proj + "」的计划表中不存在"); return; }
    if(hits.length > 1){ errors.push(where + "任务「" + dp.task + "」有重名，无法唯一确定"); return; }
    var res = resolveDepCell(dp.depRaw, titleSetByProj[dp.proj]);
    res.unresolved.forEach(function(u){
      errors.push(where + "前置任务「" + u + "」在项目「" + dp.proj + "」中不存在");
    });
    res.deps.forEach(function(d){
      if(d === dp.task){ errors.push(where + "前置任务不能是任务自身"); return; }
      if(hits[0].depTitles.indexOf(d) === -1){ hits[0].depTitles.push(d); depSheetCount++; }
    });
  });

  // Validate dependencies within each project group (title resolution, self-ref, existence, cycles).
  Object.keys(groups).forEach(function(pn){
    var tasks = groups[pn];
    // --- level sequencing: a level-N row must follow a level-(N-1) row (its parent) ---
    var lastAtLevel = {};   // level -> most recent task at that level
    tasks.forEach(function(tk){
      var lv = tk.level || 1;
      if(lv > 1 && !lastAtLevel[lv - 1]){
        errors.push("第 " + tk._row + " 行：第 " + lv + " 级任务「" + tk.title + "」缺少上一级父任务（请确保其上方存在第 " + (lv-1) + " 级任务行）");
      }
      lastAtLevel[lv] = tk;
      // deeper levels reset when a shallower one appears
      for(var d = lv + 1; d <= MAX_TASK_DEPTH; d++){ lastAtLevel[d] = null; }
    });
    var titleCount = {};
    tasks.forEach(function(tk){ titleCount[tk.title] = (titleCount[tk.title]||0) + 1; });
    // adjacency for cycle check
    var adj = {}; // title -> [depTitles]
    tasks.forEach(function(tk){
      tk.depTitles.forEach(function(dt){
        if(dt === tk.title){ errors.push("第 " + tk._row + " 行：前置任务不能是任务自身"); return; }
        if(!(dt in titleCount)){ errors.push("第 " + tk._row + " 行：前置任务「" + dt + "」在同项目内不存在"); return; }
        if(titleCount[dt] > 1){ errors.push("第 " + tk._row + " 行：前置任务「" + dt + "」有重名，无法唯一确定"); return; }
        (adj[tk.title] = adj[tk.title] || []).push(dt);
      });
      if(titleCount[tk.title] > 1){ /* duplicate task titles */ }
    });
    // cycle detection via DFS
    var color = {}; // 0=unvisited,1=in-stack,2=done
    var cyc = false;
    function dfs(node){
      color[node] = 1;
      (adj[node]||[]).forEach(function(nb){
        if(color[nb] === 1){ cyc = true; }
        else if(!color[nb]){ dfs(nb); }
      });
      color[node] = 2;
    }
    Object.keys(titleCount).forEach(function(tt){ if(!color[tt]) dfs(tt); });
    if(cyc){ errors.push("项目「" + pn + "」的前置任务存在循环依赖，无法导入"); }
  });

  return { errors: errors, groups: groups, projStatusByName: projStatusByName,
           notes: { autoParents: autoParents, roundedWorkdays: roundedWorkdays,
                    depSheetCount: depSheetCount } };
}

// Apply validated groups: for each project name, replace all its tasks wholesale.
function applyImport(groups, projStatusByName){
  projStatusByName = projStatusByName || {};
  mutate(function(){
    Object.keys(groups).forEach(function(projName){
      var proj = state.projects.find(function(p){ return p.name === projName; });
      if(!proj) return;
      // update project status if the file supplied one
      if(projStatusByName[projName]){ proj.status = projStatusByName[projName]; }
      // remove existing tasks of this project
      state.milestones = state.milestones.filter(function(m){ return m.projectId !== proj.id; });
      // add imported tasks, tracking title->id for dep resolution and level->last task for parenting
      var titleToId = {};
      var created = [];
      var lastIdAtLevel = {};   // level -> id of most recent task at that level
      groups[projName].forEach(function(tk){
        var lv = tk.level || 1;
        var parentId = (lv > 1) ? (lastIdAtLevel[lv - 1] || null) : null;
        var nt = {
          id: uid(), projectId: proj.id,
          title: tk.title, owner: tk.owner, start: tk.start, end: tk.end,
          status: tk.status, isMilestone: !parentId,
          workdays: tk.workdays, deps: [], parentId: parentId
        };
        state.milestones.push(nt);
        lastIdAtLevel[lv] = nt.id;
        for(var d = lv + 1; d <= MAX_TASK_DEPTH; d++){ lastIdAtLevel[d] = null; }
        created.push({ node: nt, depTitles: tk.depTitles || [] });
        if(!(tk.title in titleToId)){ titleToId[tk.title] = nt.id; }
      });
      // wire deps by title
      created.forEach(function(c){
        c.node.deps = c.depTitles.map(function(dt){ return titleToId[dt]; }).filter(Boolean);
      });
    });
    // recompute schedules honoring dependencies across everything imported
    reflowAllDependencies();
    rollupParentDates();
  });
}

function openImportExcelModal(){

    '<div class="modal-body">' +

      '<label class="imp-drop" id="impDrop">' +
