name: 构建 Windows 绿色版

# 产出便携包：exe + 数据目录，以及固定版本 WebView2 运行时。
# 目标机器是公司管控的 Win10，可能既没有 Evergreen WebView2 运行时，也没有安装权限，
# 所以运行时随包提供，程序不依赖系统更新也不需要管理员权限。
#
# 运行时约 250 MB 而程序只有几 MB，且运行时版本很少变，所以拆成两个包：
#   程序包   —— 每次都产出，几 MB
#   运行时包 —— 只在打 tag 或手动勾选时产出，下载一次放到程序旁即可长期复用
# 两个包的顶层目录相同，解压到同一位置会自动合并。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下就出包
    inputs:
      with_runtime:
        description: "同时产出 WebView2 运行时包（约 250 MB，首次部署或升级运行时才需要）"
        type: boolean
        default: false

permissions:
  contents: write           # 打 tag 时创建 Release 用

env:
  # 固定版本 WebView2。换版本只改这里；版本号可在
  # https://developer.microsoft.com/microsoft-edge/webview2/ 查到。
  WEBVIEW2_VERSION: "131.0.2903.112"

jobs:
  # 数据层不依赖任何 GUI 库，放在 Linux 上跑，几十秒就能挡住会毁数据的改动，
  # 不用等 Windows runner。
  test-core:
    name: 数据层单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: cargo test
        working-directory: core
        run: cargo test --verbose

  build:
    name: 打包
    needs: test-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 由网页版生成桌面版前端
        run: node build-dist.mjs

      - name: 下载固定版本 WebView2 运行时
        shell: pwsh
        # 微软 CDN 上的 .cab 路径带随版本变化的 GUID，无法按版本号拼出；
        # NuGet 的 WebView2.Runtime.X64 包就是同一份固定版本运行时，地址由版本号唯一确定。
        run: |
          $ver = "${env:WEBVIEW2_VERSION}"
          $url = "https://api.nuget.org/v3-flatcontainer/webview2.runtime.x64/$ver/webview2.runtime.x64.$ver.nupkg"
          Write-Host "下载 $url"
          Invoke-WebRequest -Uri $url -OutFile webview2.zip -UseBasicParsing
          Expand-Archive webview2.zip -DestinationPath webview2-pkg -Force
          # 运行时在包内的 contentFiles/any/any/WebView2/，msedgewebview2.exe 直接位于该目录根下
          $src = "webview2-pkg/contentFiles/any/any/WebView2"
          if (-not (Test-Path "$src\msedgewebview2.exe")) {
            throw "WebView2 运行时解包失败：找不到 msedgewebview2.exe"
          }
          New-Item -ItemType Directory -Force -Path src-tauri\webview2 | Out-Null
          Copy-Item "$src\*" src-tauri\webview2 -Recurse -Force
          Write-Host "WebView2 就绪：$((Get-ChildItem src-tauri\webview2 -Recurse | Measure-Object Length -Sum).Sum / 1MB) MB"

      - name: 编译
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: 组装绿色版
        shell: pwsh
        run: |
          $out = "dist-portable\项目里程碑指挥台"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\milestone-command.exe" `
                    (Join-Path $out "项目里程碑指挥台.exe")
          # 运行时放在 exe 旁边的 webview2\，main.rs 启动时会指向这里
          Copy-Item "src-tauri\webview2" (Join-Path $out "webview2") -Recurse
          # 预建数据目录：解压后第一次运行就知道数据写在哪
          New-Item -ItemType Directory -Force -Path (Join-Path $out "data") | Out-Null
          Copy-Item "PORTABLE-README.txt" (Join-Path $out "使用说明.txt") -ErrorAction SilentlyContinue

          $exe = Get-Item (Join-Path $out "项目里程碑指挥台.exe")
          $total = (Get-ChildItem $out -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("主程序 {0:N2} MB，整包 {1:N0} MB" -f ($exe.Length/1MB), ($total/1MB))

      - name: 冒烟测试 — 程序能否真正启动
        shell: pwsh
        # 一个编译通过但一启动就崩的 exe 没有意义。这里真的把它拉起来，
        # 确认进程活着、WebView2 子进程被拉起、并且在数据目录里写出了文件。
        run: |
          $app = "dist-portable\项目里程碑指挥台\项目里程碑指挥台.exe"
          $p = Start-Process $app -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "程序启动后立即退出，退出码 $($p.ExitCode)" }
          $wv = Get-Process msedgewebview2 -ErrorAction SilentlyContinue
          if (-not $wv) { throw "WebView2 进程未启动——固定版本运行时可能没被正确加载" }
          $mem = ($p.WorkingSet64 + ($wv | Measure-Object WorkingSet64 -Sum).Sum) / 1MB
          Write-Host ("进程常驻内存合计 {0:N0} MB" -f $mem)
          $data = Get-ChildItem "dist-portable\项目里程碑指挥台\data" -ErrorAction SilentlyContinue
          if (-not $data) { throw "数据目录为空——存储没有写成功" }
          Write-Host "数据目录已写入：$($data.Name -join ', ')"
          Stop-Process -Id $p.Id -Force
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force

      # 打包放在冒烟测试之后：测试会往 data\ 里写文件，不能把它们带进发布包。
      - name: 拆分打包（程序包 / 运行时包）
        shell: pwsh
        run: |
          $name = "项目里程碑指挥台"
          $full = "dist-portable\$name"

          # 程序包：exe + 空数据目录 + 说明，不含 webview2
          $app = "dist-app\$name"
          New-Item -ItemType Directory -Force -Path "$app\data" | Out-Null
          Copy-Item "$full\$name.exe" $app
          Copy-Item "$full\使用说明.txt" $app -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist-app\*" -DestinationPath "$name-程序包-win64.zip"

          # 运行时包：只含 webview2\，解压到程序旁边即可
          $withRuntime = ("${{ github.event.inputs.with_runtime }}" -eq "true") -or ("${{ github.ref }}" -like "refs/tags/v*")
          if ($withRuntime) {
            $rt = "dist-runtime\$name"
            New-Item -ItemType Directory -Force -Path $rt | Out-Null
            Copy-Item "$full\webview2" $rt -Recurse
            Compress-Archive -Path "dist-runtime\*" -DestinationPath "$name-WebView2运行时-$env:WEBVIEW2_VERSION-win64.zip"
          }
          "WITH_RUNTIME=$withRuntime" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Get-ChildItem *.zip | ForEach-Object { Write-Host ("{0}  {1:N1} MB" -f $_.Name, ($_.Length/1MB)) }

      - uses: actions/upload-artifact@v4
        with:
          name: 项目里程碑指挥台-程序包-win64
          path: 项目里程碑指挥台-程序包-win64.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: env.WITH_RUNTIME == 'True'
        with:
          name: 项目里程碑指挥台-WebView2运行时-win64
          path: 项目里程碑指挥台-WebView2运行时-*.zip
          retention-days: 90
          compression-level: 0     # zip 已经压缩过，再压一遍只是浪费时间

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            项目里程碑指挥台-程序包-win64.zip
            项目里程碑指挥台-WebView2运行时-*.zip
          body: |
            ## 首次部署
            两个包都下载，解压到**同一个**有写权限的目录（会自动合并到同一个文件夹），
            双击「项目里程碑指挥台.exe」即可运行。

            ## 之后升级
            只需要下载「程序包」，覆盖解压即可；`data\` 里的数据不会被动。
            WebView2 运行时包只有在升级运行时版本时才需要重新下载。

            - 免安装，不写注册表，不需要管理员权限
            - 数据存在 `data\` 子目录，整个文件夹拷走即可换机器
            - 每次保存自动保留最近 10 个版本备份，在 `data\backups\`
